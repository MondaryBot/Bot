<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="color-scheme" content="dark light">
<title>Крафты · Выживание Бот</title>
<style>
  :root {
    --bg-1: #0f1419; --bg-2: #0a0d12;
    --card: #161d27; --card-2: #131a23;
    --border: #263140; --border-hi: #ff9f3d;
    --text: #e8eef6; --text-dim: #93a3b8; --text-mut: #5f7086;
    --accent: #ffa94d; --accent-2: #ff8c42;
    --accent-glow: rgba(255,169,77,0.16);
    --accent-glow-strong: rgba(255,140,66,0.4);
    --grad: linear-gradient(135deg, #ffa94d 0%, #ff8c42 50%, #ff6b35 100%);
    --grad-soft: linear-gradient(135deg, rgba(255,169,77,0.15), rgba(255,140,66,0.05));
    --shadow: rgba(0,0,0,0.5);
    --radius: 18px;
    --divider: #2a3644;
    --toggle-bg: #1f2a36; --toggle-border: #2f3d4f;
    --glow-1: rgba(255,169,77,0.12);
    --glow-2: rgba(255,140,66,0.06);
    --inset: rgba(255,255,255,0.05);
    --slot: #1c2530; --slot-2: #18202a; --slot-empty: #12181f;
    --row-h: 48px;
    --pill-bg: rgba(255,255,255,0.04);
  }
  html.light {
    --bg-1: #e8dfd1; --bg-2: #d9cdb9;
    --card: #ffffff; --card-2: #fdfaf4;
    --border: #c1a880;
    --text: #120c04; --text-dim: #3f3122; --text-mut: #6e5b41;
    --accent: #c98850; --accent-2: #a35d28;
    --accent-glow: rgba(201, 136, 80, 0.28);
    --accent-glow-strong: rgba(201, 136, 80, 0.5);
    --grad: linear-gradient(135deg, #d99a5c 0%, #c98850 55%, #b07340 100%);
    --grad-soft: linear-gradient(135deg, rgba(201,136,80,0.18), rgba(176,115,64,0.06));
    --shadow: rgba(70, 45, 15, 0.22);
    --shadow-soft: rgba(70, 45, 15, 0.12);
    --divider: #c9b189;
    --toggle-bg: #d6c3a5; --toggle-border: #a58a60;
    --glow-1: rgba(201, 136, 80, 0.16);
    --glow-2: rgba(176, 115, 64, 0.09);
    --inset: rgba(255, 255, 255, 1);
    --pill-bg: rgba(201, 136, 80, 0.10);
    --slot: #f5ebdc; --slot-2: #ecdfc9; --slot-empty: #e5d7bd;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -10%, var(--glow-1), transparent 60%),
      radial-gradient(800px 500px at 90% 110%, var(--glow-2), transparent 70%),
      linear-gradient(180deg, var(--bg-1), var(--bg-2));
    background-attachment: fixed; color: var(--text);
    padding: 32px 16px calc(40px + env(safe-area-inset-bottom));
    padding-top: calc(28px + env(safe-area-inset-top));
    min-height: 100vh; min-height: 100dvh;
    line-height: 1.5;
    transition: background 0.5s ease, color 0.35s ease;
  }
  .mandarins-bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .mandarin-float {
    position: absolute; font-size: 1.5rem; opacity: 0;
    animation: mandarinFloat linear infinite;
    filter: drop-shadow(0 0 8px var(--accent-glow));
  }
  @keyframes mandarinFloat {
    0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
    10% { opacity: 0.16; }
    90% { opacity: 0.16; }
    100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
  }
  .progress-bar { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 1000; }
  .progress-fill { height: 100%; width: 0%; background: var(--grad); box-shadow: 0 0 14px var(--accent-glow-strong); transition: width 0.1s linear; }
  .header { position: relative; max-width: 1280px; margin: 0 auto 24px; display: flex; align-items: center; justify-content: center; min-height: 60px; }
  h1.title {
    font-size: clamp(1.5rem, 4.5vw, 2.2rem);
    font-weight: 900; letter-spacing: -0.04em;
    background: var(--grad);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-align: center;
    animation: titleIn 0.7s cubic-bezier(0.2, 0.8, 0.3, 1) both;
  }
  @keyframes titleIn { from { opacity: 0; transform: translateY(-18px); } to { opacity: 1; transform: translateY(0); } }
  .back-link {
    position: absolute; left: 0; top: 50%; transform: translateY(-50%);
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px; border-radius: 10px;
    background: var(--card); border: 1px solid var(--border);
    color: var(--text-dim); text-decoration: none;
    font-size: 0.85rem; font-weight: 700;
    transition: all 0.25s ease;
  }
  .back-link:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-50%) translateX(-3px); }
  .theme-toggle {
    position: absolute; right: 0; top: 50%; transform: translateY(-50%);
    width: 60px; height: 32px; border-radius: 30px;
    background: var(--toggle-bg); border: 1px solid var(--toggle-border);
    cursor: pointer; transition: all 0.35s ease;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.08);
  }
  .theme-toggle:hover { border-color: var(--accent); box-shadow: inset 0 2px 4px rgba(0,0,0,0.08), 0 0 28px var(--accent-glow-strong); }
  .toggle-knob {
    position: absolute; top: 2px; left: 2px;
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--grad);
    box-shadow: 0 2px 8px var(--accent-glow-strong);
    transition: left 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.85rem;
  }
  html.light .toggle-knob { left: calc(100% - 28px); }
  .toggle-knob .k-ico { position: absolute; transition: opacity 0.3s, transform 0.4s; }
  .k-ico.moon { opacity: 1; } .k-ico.sun { opacity: 0; transform: rotate(-90deg); }
  html.light .k-ico.moon { opacity: 0; transform: rotate(90deg); }
  html.light .k-ico.sun { opacity: 1; transform: rotate(0deg); }

  .container { max-width: 1280px; margin: 0 auto; }

  .search-panel {
    background: linear-gradient(160deg, var(--card), var(--card-2));
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
    box-shadow: 0 6px 20px var(--shadow), inset 0 1px 0 var(--inset);
    margin-bottom: 24px;
    animation: cardIn 0.5s cubic-bezier(0.2, 0.8, 0.3, 1) both;
  }
  @keyframes cardIn { from { opacity: 0; transform: translateY(24px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .search-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .search-input-wrap { flex: 1; min-width: 200px; position: relative; }
  .search-input {
    width: 100%; padding: 14px 16px 14px 44px;
    border-radius: 12px;
    background: var(--card); border: 1px solid var(--border);
    color: var(--text); font-size: 0.95rem; font-family: inherit;
    transition: all 0.25s ease;
  }
  .search-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
  .search-input::placeholder { color: var(--text-mut); }
  .search-ico { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 1.1rem; opacity: 0.6; pointer-events: none; }
  .search-clear {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--pill-bg); border: none;
    color: var(--text-dim); cursor: pointer;
    display: none; align-items: center; justify-content: center;
    font-size: 1rem; transition: all 0.2s ease;
  }
  .search-clear.visible { display: flex; }
  .search-clear:hover { background: var(--accent-glow); color: var(--accent); }

  .filter-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .chip {
    padding: 8px 14px; border-radius: 10px;
    background: var(--card); border: 1px solid var(--border);
    color: var(--text-dim); font-size: 0.85rem; font-weight: 700;
    cursor: pointer; transition: all 0.25s cubic-bezier(0.2, 0.8, 0.3, 1);
    user-select: none;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip.active {
    background: var(--grad); color: #fff;
    border-color: transparent;
    box-shadow: 0 4px 14px var(--accent-glow-strong);
  }
  .results-info {
    margin-top: 14px; font-size: 0.85rem; color: var(--text-mut);
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px;
  }
  .results-info strong { color: var(--accent); font-weight: 800; }

  .grid { display: flex; flex-direction: column; gap: 32px; }
  .level-block { animation: cardIn 0.6s cubic-bezier(0.2, 0.8, 0.3, 1) both; }
  .level-header { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
  .level-badge {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 18px; border-radius: 12px;
    background: var(--grad); color: #fff;
    font-weight: 900; font-size: 1rem;
    letter-spacing: 0.02em;
    box-shadow: 0 8px 24px var(--accent-glow-strong);
    white-space: nowrap;
    position: relative; overflow: hidden;
  }
  .level-badge::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
    transform: translateX(-100%);
    animation: shine 3.5s ease-in-out infinite;
  }
  @keyframes shine { 0%, 60% { transform: translateX(-100%); } 100% { transform: translateX(220%); } }
  .level-line { flex: 1; height: 3px; background: var(--divider); border-radius: 3px; position: relative; overflow: hidden; }
  .level-line::after {
    content: ''; position: absolute; inset: 0; background: var(--grad);
    transform: scaleX(0); transform-origin: left;
    animation: lineGrow 1s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
  }
  @keyframes lineGrow { to { transform: scaleX(1); } }
  .level-count {
    font-size: 0.8rem; font-weight: 800;
    color: var(--text-mut);
    background: var(--card); border: 1px solid var(--border);
    padding: 6px 12px; border-radius: 9px;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .level-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 18px;
  }

  .recipe-card {
    position: relative;
    background: linear-gradient(160deg, var(--card), var(--card-2));
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
    box-shadow: 0 3px 14px var(--shadow), inset 0 1px 0 var(--inset);
    transition: all 0.28s cubic-bezier(0.2, 0.8, 0.3, 1);
  }
  .recipe-card::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(400px 140px at 50% 0%, var(--accent-glow), transparent 70%);
    opacity: 0; transition: opacity 0.35s ease;
    pointer-events: none;
    border-radius: var(--radius);
  }
  .recipe-card:hover::before { opacity: 1; }
  @media (hover: hover) {
    .recipe-card:hover {
      transform: translateY(-6px) scale(1.015);
      border-color: var(--accent);
      box-shadow: 0 20px 40px var(--shadow), 0 6px 20px var(--accent-glow);
    }
    .recipe-card:hover .recipe-icon {
      transform: scale(1.1) rotate(-5deg);
      border-color: var(--accent);
      box-shadow: 0 0 20px var(--accent-glow-strong);
    }
  }
  .recipe-head { display: flex; align-items: flex-start; gap: 14px; }
  .recipe-icon {
    position: relative;
    font-size: 1.7rem; min-width: 54px; height: 54px;
    padding: 0 10px;
    display: flex; align-items: center; justify-content: center;
    gap: 3px;
    background: var(--grad-soft);
    border: 1px solid var(--border);
    border-radius: 14px;
    flex-shrink: 0; white-space: nowrap;
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .recipe-info { min-width: 0; flex: 1; }
  .recipe-name {
    font-size: 1.05rem; font-weight: 800;
    color: var(--text); line-height: 1.25;
    overflow-wrap: anywhere;
    margin-bottom: 6px;
  }
  .recipe-meta { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 0.74rem; font-weight: 700;
    color: var(--text-dim);
    background: var(--pill-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px 9px;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .pill b { color: var(--text); }
  .pill.time { color: var(--accent); border-color: var(--accent); background: var(--accent-glow); }
  .pill.time b { color: var(--accent); }

  .craft-label {
    font-size: 0.68rem; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--text-mut);
    font-weight: 800; margin-bottom: -4px;
  }
  .craft-grid {
    display: grid; gap: 5px;
    grid-auto-rows: var(--row-h);
    justify-content: start;
    overflow-x: auto; overflow-y: visible;
    padding: 8px 4px 10px;
    margin: -8px -4px -10px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .craft-grid::-webkit-scrollbar { height: 6px; }
  .craft-grid::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .slot {
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(160deg, var(--slot), var(--slot-2));
    border: 1px solid var(--border);
    border-radius: 11px;
    line-height: 1; overflow: hidden;
    height: var(--row-h);
    padding: 0 5px;
    font-size: 1.45rem;
    white-space: nowrap; letter-spacing: -1px;
    box-shadow: inset 0 1px 0 var(--inset);
    transition: all 0.22s ease;
    cursor: pointer;
    position: relative;
  }
  @media (hover: hover) {
    .slot:not(.empty):hover { transform: translateY(-2px) scale(1.04); z-index: 3; }
  }
  .slot.empty {
    background: repeating-linear-gradient(45deg,
      var(--pill-bg), var(--pill-bg) 4px,
      transparent 4px, transparent 8px),
      var(--slot-empty);
    border: 1px dashed var(--border);
    box-shadow: none; cursor: default;
    position: relative;
  }
  .slot.empty::after {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--text-mut);
    opacity: 0.5;
  }
.slot-count {
  position: absolute;
  right: 3px;
  bottom: 1px;
  font-size: 0.72rem;
  font-weight: 900;
  color: #fff;
  line-height: 1;
  pointer-events: none;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
  text-shadow:
    0 0 2px rgba(0,0,0,0.95),
    0 1px 2px rgba(0,0,0,0.9),
    0 -1px 2px rgba(0,0,0,0.9),
    1px 0 2px rgba(0,0,0,0.9),
    -1px 0 2px rgba(0,0,0,0.9);
}
html.light .slot-count {
  color: #fff;
  text-shadow:
    0 0 3px rgba(90, 50, 10, 0.9),
    0 1px 2px rgba(90, 50, 10, 0.85),
    0 -1px 2px rgba(90, 50, 10, 0.85),
    1px 0 2px rgba(90, 50, 10, 0.85),
    -1px 0 2px rgba(90, 50, 10, 0.85);
}
  .empty-state {
    text-align: center; padding: 60px 20px;
    color: var(--text-mut); font-size: 1.05rem;
    background: var(--card);
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    margin: 20px 0;
  }
  .empty-state .emo { font-size: 3rem; display: block; margin-bottom: 12px; opacity: 0.5; }

  .tip {
    position: fixed;
    background: var(--card);
    border: 1px solid var(--accent);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 0.82rem; font-weight: 700;
    color: var(--text);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s ease;
    box-shadow: 0 8px 24px var(--shadow), 0 0 20px var(--accent-glow);
    z-index: 9999;
    white-space: nowrap;
    transform: translate(-50%, -140%);
  }
  .tip.visible { opacity: 1; }

  .footer {
    max-width: 1280px; margin: 72px auto 0;
    padding: 40px 16px 24px;
    border-top: 1px solid var(--divider);
    text-align: center; color: var(--text-mut); font-size: 0.88rem;
  }
  .footer-links { display: flex; flex-wrap: wrap; gap: 22px; justify-content: center; margin-bottom: 22px; }
  .footer-links a { color: var(--text-dim); text-decoration: none; font-weight: 600; transition: color 0.2s ease; }
  .footer-links a:hover { color: var(--accent); }
  .footer-dev { margin-top: 14px; padding-top: 18px; border-top: 1px dashed var(--divider); font-size: 0.85rem; }
  .footer-dev a { color: var(--accent); text-decoration: none; font-weight: 700; }

  @media (max-width: 560px) {
    :root { --row-h: 44px; }
    body { padding: 18px 12px calc(28px + env(safe-area-inset-bottom)); }
    .header { min-height: 48px; margin-bottom: 18px; }
    .theme-toggle { width: 52px; height: 30px; }
    .toggle-knob { width: 24px; height: 24px; font-size: 0.78rem; }
    html.light .toggle-knob { left: calc(100% - 26px); }
    .back-link { padding: 6px 10px; font-size: 0.75rem; }
    .search-panel { padding: 16px; }
    .level-grid { grid-template-columns: 1fr; gap: 14px; }
    .recipe-card { padding: 14px; gap: 12px; }
    .recipe-icon { min-width: 48px; height: 48px; font-size: 1.5rem; }
    .recipe-name { font-size: 0.98rem; }
    .pill { font-size: 0.7rem; padding: 3px 8px; }
    .slot { font-size: 1.3rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
  html.light body {
    background:
      radial-gradient(1000px 500px at 50% -10%, var(--glow-1), transparent 60%),
      radial-gradient(700px 400px at 90% 110%, var(--glow-2), transparent 70%),
      linear-gradient(180deg, var(--bg-1), var(--bg-2));
  }
  html.light .recipe-card,
  html.light .search-panel {
    box-shadow:
      0 1px 0 rgba(255, 255, 255, 1) inset,
      0 6px 20px var(--shadow-soft),
      0 2px 6px rgba(70, 45, 15, 0.08);
  }
  html.light .recipe-card:hover {
    box-shadow:
      0 1px 0 rgba(255, 255, 255, 1) inset,
      0 20px 40px var(--shadow),
      0 8px 22px var(--accent-glow);
  }
  html.light .level-badge {
    background: linear-gradient(135deg, #d99a5c 0%, #c98850 55%, #b07340 100%);
    box-shadow: 0 4px 14px var(--accent-glow-strong), 0 1px 0 rgba(255, 255, 255, 0.4) inset;
    color: #fff;
  }
  html.light .chip { background: linear-gradient(160deg, #fffaf2, #fbf3e5); }
  html.light .chip.active {
    background: linear-gradient(135deg, #d99a5c 0%, #c98850 55%, #b07340 100%);
    color: #fff;
    box-shadow: 0 4px 14px var(--accent-glow-strong);
  }
  html.light .slot {
    background: linear-gradient(160deg, #fbf3e5, #f0e2c9);
    border-color: var(--border);
    box-shadow: 0 1px 0 #fff inset, 0 1px 3px rgba(70, 45, 15, 0.08);
  }
  html.light .theme-toggle {
    background: linear-gradient(135deg, #d9c7a7, #c8b28d);
    border-color: #a58a60;
    box-shadow: 0 2px 6px rgba(70, 45, 15, 0.2) inset;
  }
</style>
</head>
<body>

  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="mandarins-bg" id="mandarinsBg"></div>

  <div class="header">
    <a href="index.html" class="back-link">← На главную</a>
    <h1 class="title">⚒️Крафты</h1>
    <button class="theme-toggle" id="themeToggle" aria-label="Переключить тему" type="button">
      <span class="toggle-knob">
        <span class="k-ico moon">🌙</span>
        <span class="k-ico sun">☀️</span>
      </span>
    </button>
  </div>

  <div class="container">

    <div class="search-panel">
      <div class="search-row">
        <div class="search-input-wrap">
          <span class="search-ico">🔍</span>
          <input
            type="text"
            class="search-input"
            id="searchInput"
            placeholder="Поиск по названию или ингредиенту…"
            autocomplete="off"
          >
          <button class="search-clear" id="searchClear" aria-label="Очистить">✕</button>
        </div>
      </div>
      <div class="filter-chips" id="filterChips">
        <button class="chip active" data-filter="all">Все</button>
        <button class="chip" data-filter="hand">✋ Руками</button>
        <button class="chip" data-filter="table">🛠️ Стол</button>
        <button class="chip" data-filter="tool">⛏️ Инструменты</button>
        <button class="chip" data-filter="weapon">⚔️ Оружие</button>

/* =========================================================
   ХЕЛПЕРЫ
   ========================================================= */
const escapeHtml = (s) =>
  String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

// Парсим "🪨 Булыжник" → { emo:"🪨", name:"Булыжник" }
function parseItem(s) {
  const m = String(s).match(/^([^\s]+)\s+(.+)$/);
  if (!m) return { emo:"", name:String(s) };
  return { emo:m[1], name:m[2] };
}

/* =========================================================
   ФИЛЬТРАЦИЯ
   ========================================================= */
let currentFilter = 'all';
let currentSearch = '';

function craftMatches(c, filter, query) {
  if (filter === 'hand' && c.station !== 'hand') return false;
  if (filter === 'table' && c.station !== 'table') return false;
  if (['tool','weapon','armor','food','potion','block','misc'].includes(filter)) {
    if (c.cat !== filter) return false;
  }
  if (!query) return true;
  const q = query.toLowerCase().trim();
  if (c.name.toLowerCase().includes(q)) return true;
  if (c.id.toLowerCase().includes(q)) return true;
  return c.needs.some(n => {
    const { name } = parseItem(n[0]);
    return name.toLowerCase().includes(q);
  });
}

/* =========================================================
   РЕНДЕР КАРТОЧКИ
   ========================================================= */
function renderCard(c) {
  const items = c.needs.map(n => parseItem(n[0]));
  const counts = c.needs.map(n => n[1]);

  const colPx = items.map((it) => {
    const len = [...it.emo].length;
    return Math.max(54, len * 28 + 24);
  });

  const slots = items.map((it, i) => {
    const cnt = counts[i];
    const badge = cnt > 1 ? `<span class="slot-count">${cnt}</span>` : '';
    return `<div class="slot" data-name="${escapeHtml(it.name)} ×${cnt}">${escapeHtml(it.emo)}${badge}</div>`;
  }).join('');

  const gridStyle = `grid-template-columns: ${colPx.map(p => p + 'px').join(' ')};`;

  const station = c.station === 'hand'
    ? `<span class="pill">✋ Руками</span>`
    : `<span class="pill">🛠️ Стол</span>`;

  const tier = c.tier
    ? `<span class="pill"><b>${c.tier}⭐</b></span>`
    : '';

  return `
    <div class="recipe-card">
      <div class="recipe-head">
        <div class="recipe-icon">${escapeHtml(c.icon)}</div>
        <div class="recipe-info">
          <div class="recipe-name">${escapeHtml(c.name)}</div>
          <div class="recipe-meta">
            ${tier}
            ${station}
          </div>
        </div>
      </div>
      <div class="craft-label">Ингредиенты</div>
      <div class="craft-grid" style="${gridStyle}">${slots}</div>
    </div>
  `;
}

/* =========================================================
   ГРУППИРОВКА + ОТРИСОВКА
   ========================================================= */
function pluralRu(n, forms) {
  const m10 = n % 10, m100 = n % 100;
  if (m100 >= 11 && m100 <= 14) return forms[2];
  if (m10 === 1) return forms[0];
  if (m10 >= 2 && m10 <= 4) return forms[1];
  return forms[2];
}

function render(filter = 'all', query = '') {
  const grid = document.getElementById('grid');
  const filtered = crafts.filter(c => craftMatches(c, filter, query));

  document.getElementById('resultsCount').textContent = filtered.length;
  document.getElementById('searchHint').textContent =
    query ? `по запросу «${query}»` : (filter !== 'all' ? `фильтр: ${filterLabel(filter)}` : '');

  if (!filtered.length) {
    grid.innerHTML = `
      <div class="empty-state">
        <span class="emo">🔍</span>
        <div>Ничего не найдено</div>
        <div style="font-size:0.85rem; margin-top:8px; opacity:0.7;">
          Попробуйте изменить запрос или сбросить фильтры
        </div>
      </div>
    `;
    return;
  }

  const groups = {};
  filtered.forEach(c => {
    const t = c.tier || 0;
    if (!groups[t]) groups[t] = [];
    groups[t].push(c);
  });

  const tiers = Object.keys(groups).map(Number).sort((a, b) => a - b);

  let html = '';
  tiers.forEach((t, ti) => {
    const list = groups[t];
    const label = t === 0 ? 'Без тира' : `${t}⭐`;
    html += `
      <section class="level-block" style="animation-delay:${ti * 0.04}s">
        <div class="level-header">
          <span class="level-badge">${label}</span>
          <span class="level-line"></span>
          <span class="level-count">${list.length} ${pluralRu(list.length, ['рецепт','рецепта','рецептов'])}</span>
        </div>
        <div class="level-grid">
    `;
    list.forEach(c => { html += renderCard(c); });
    html += `</div></section>`;
  });

  grid.innerHTML = html;
  attachTooltips();
}

function filterLabel(f) {
  if (f === 'hand') return 'Руками';
  if (f === 'table') return 'Стол';
  const labels = {
    tool:"Инструменты", weapon:"Оружие", armor:"Броня",
    food:"Еда", potion:"Зелья", block:"Блоки", misc:"Прочее"
  };
  return labels[f] || f;
}

/* =========================================================
   TOOLTIP
   ========================================================= */
function attachTooltips() {
  const tip = document.getElementById('tooltip');
  document.querySelectorAll('.slot:not(.empty)').forEach(slot => {
    slot.addEventListener('mouseenter', () => {
      const name = slot.dataset.name;
      if (!name) return;
      tip.textContent = name;
      const rect = slot.getBoundingClientRect();
      tip.style.left = (rect.left + rect.width / 2) + 'px';
      tip.style.top = rect.top + 'px';
      tip.classList.add('visible');
    });
    slot.addEventListener('mouseleave', () => tip.classList.remove('visible'));
  });
}

/* =========================================================
   СОБЫТИЯ
   ========================================================= */
const searchInput = document.getElementById('searchInput');
const searchClear = document.getElementById('searchClear');
const filterChips = document.getElementById('filterChips');

searchInput.addEventListener('input', (e) => {
  currentSearch = e.target.value;
  searchClear.classList.toggle('visible', currentSearch.length > 0);
  render(currentFilter, currentSearch);
});

searchClear.addEventListener('click', () => {
  searchInput.value = '';
  currentSearch = '';
  searchClear.classList.remove('visible');
  render(currentFilter, currentSearch);
  searchInput.focus();
});

filterChips.addEventListener('click', (e) => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  filterChips.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  currentFilter = chip.dataset.filter;
  render(currentFilter, currentSearch);
});

/* ============ ПРОГРЕСС-БАР ============ */
const progressFill = document.getElementById('progressFill');
window.addEventListener('scroll', () => {
  const h = document.documentElement.scrollHeight - window.innerHeight;
  progressFill.style.width = (h > 0 ? (window.scrollY / h) * 100 : 0) + '%';
}, { passive: true });

/* ============ ТЕМА ============ */
const themeToggle = document.getElementById('themeToggle');
const root = document.documentElement;
const mql = window.matchMedia('(prefers-color-scheme: light)');
function getStoredTheme() { try { return localStorage.getItem('theme'); } catch(e) { return null; } }
function storeTheme(t) { try { localStorage.setItem('theme', t); } catch(e) {} }
function applyTheme(t) {
  if (t === 'light') {
    root.classList.add('light'); root.style.colorScheme = 'light';
    document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#fff8f0');
  } else {
    root.classList.remove('light'); root.style.colorScheme = 'dark';
    document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#0d1117');
  }
}
function initTheme() {
  const s = getStoredTheme();
  if (s === 'light' || s === 'dark') applyTheme(s);
  else applyTheme(mql.matches ? 'light' : 'dark');
}
function toggleTheme() {
  const isLight = root.classList.contains('light');
  applyTheme(isLight ? 'dark' : 'light');
  storeTheme(isLight ? 'dark' : 'light');
}
themeToggle.addEventListener('click', toggleTheme);
themeToggle.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleTheme(); }
});
mql.addEventListener('change', (e) => { if (!getStoredTheme()) applyTheme(e.matches ? 'light' : 'dark'); });

/* ============ ФОН ============ */
(function() {
  const bg = document.getElementById('mandarinsBg');
  const count = window.innerWidth < 600 ? 12 : 20;
  const emojis = ['🍊','⛏️','⚔️','💎','🌿','🔥','⭐'];
  for (let i = 0; i < count; i++) {
    const m = document.createElement('span');
    m.className = 'mandarin-float';
    m.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    m.style.left = Math.random() * 100 + '%';
    m.style.fontSize = (1 + Math.random() * 1.4) + 'rem';
    m.style.animationDuration = (18 + Math.random() * 14) + 's';
    m.style.animationDelay = (Math.random() * 22) + 's';
    bg.appendChild(m);
  }
})();

/* ============ СТАРТ ============ */
