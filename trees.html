<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="color-scheme" content="dark light">
<title>Древо талантов</title>
<style>
  :root {
    --bg-1: #0f1419;
    --bg-2: #0a0d12;
    --card: #161d27;
    --card-2: #131a23;
    --border: #263140;
    --text: #e8eef6;
    --text-dim: #93a3b8;
    --text-mut: #5f7086;
    --accent: #d99a5c;
    --accent-2: #c98850;
    --accent-glow: rgba(217, 154, 92, 0.12);
    --accent-glow-strong: rgba(217, 154, 92, 0.25);
    --grad: linear-gradient(135deg, #d99a5c 0%, #c98850 100%);
    --grad-soft: linear-gradient(135deg, rgba(217,154,92,0.10), rgba(201,136,80,0.03));
    --shadow: rgba(0, 0, 0, 0.45);
    --radius: 16px;
    --divider: #2a3644;
    --toggle-bg: #1f2a36;
    --toggle-border: #2f3d4f;
    --glow-1: rgba(217, 154, 92, 0.06);
    --glow-2: rgba(201, 136, 80, 0.03);
    --inset: rgba(255, 255, 255, 0.04);
    --line: #34424f;
    --line-hi: rgba(217, 154, 92, 0.85);
    --node-bg: #1c2533;
    --node-bg-hover: #222e3e;
    --node-border: #3a4a5e;
    --node-icon-bg: rgba(255,255,255,0.06);
    --node-icon-border: rgba(255,255,255,0.1);
    --price-bg: rgba(255,255,255,0.08);
    --price-text: #ffd700;
    --tooltip-bg: #1a2332;
    --tooltip-border: #3a4a5e;
    --tooltip-shadow: rgba(0,0,0,0.8);
    --level-line: #4a5a6e;
    --level-text: #93a3b8;
  }
  html.light {
    --bg-1: #e8dfd1;
    --bg-2: #d9cdb9;
    --card: #ffffff;
    --card-2: #fdfaf4;
    --border: #c1a880;
    --text: #120c04;
    --text-dim: #3f3122;
    --text-mut: #6e5b41;
    --accent: #c98850;
    --accent-2: #a35d28;
    --accent-glow: rgba(201, 136, 80, 0.28);
    --accent-glow-strong: rgba(201, 136, 80, 0.5);
    --grad: linear-gradient(135deg, #d99a5c 0%, #c98850 55%, #b07340 100%);
    --grad-soft: linear-gradient(135deg, rgba(201,136,80,0.18), rgba(176,115,64,0.06));
    --shadow: rgba(70, 45, 15, 0.22);
    --shadow-soft: rgba(70, 45, 15, 0.12);
    --divider: #c9b189;
    --toggle-bg: #d6c3a5;
    --toggle-border: #a58a60;
    --glow-1: rgba(201, 136, 80, 0.16);
    --glow-2: rgba(176, 115, 64, 0.09);
    --inset: rgba(255, 255, 255, 1);
    --line: #b8a181;
    --line-hi: rgba(201, 136, 80, 0.9);
    --node-bg: #fbf3e5;
    --node-bg-hover: #f5ebdc;
    --node-border: #d4c0a0;
    --node-icon-bg: rgba(0,0,0,0.04);
    --node-icon-border: rgba(0,0,0,0.08);
    --price-bg: rgba(0,0,0,0.06);
    --price-text: #8b6914;
    --tooltip-bg: #ffffff;
    --tooltip-border: #d4c0a0;
    --tooltip-shadow: rgba(70, 45, 15, 0.25);
    --level-line: #c9b189;
    --level-text: #6e5b41;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background:
      radial-gradient(1000px 500px at 50% -10%, var(--glow-1), transparent 60%),
      radial-gradient(700px 400px at 90% 110%, var(--glow-2), transparent 70%),
      linear-gradient(180deg, var(--bg-1), var(--bg-2));
    background-attachment: fixed;
    color: var(--text);
    padding: 20px 12px calc(30px + env(safe-area-inset-bottom));
    padding-top: calc(20px + env(safe-area-inset-top));
    min-height: 100vh;
    min-height: 100dvh;
    line-height: 1.5;
    overflow-x: hidden;
    transition: background 0.5s ease, color 0.35s ease;
  }
  .mandarins-bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .mandarin-float {
    position: absolute; font-size: 1.5rem; opacity: 0;
    animation: mandarinFloat linear infinite;
    filter: drop-shadow(0 0 8px var(--accent-glow));
  }
  @keyframes mandarinFloat {
    0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
    10% { opacity: 0.16; }
    90% { opacity: 0.16; }
    100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
  }
  .progress-bar { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 1000; }
  .progress-fill { height: 100%; width: 0%; background: var(--grad); box-shadow: 0 0 14px var(--accent-glow-strong); transition: width 0.1s linear; }

  .header {
    position: relative; max-width: 1400px; margin: 0 auto 20px;
    display: flex; align-items: center; justify-content: center;
    min-height: 50px; z-index: 10;
  }
  h1.title {
    font-size: clamp(1.2rem, 4vw, 1.8rem);
    font-weight: 900; letter-spacing: -0.04em;
    background: var(--grad);
    -webkit-background-clip: text; background-clip: text;
    color: transparent; text-align: center;
    animation: titleIn 0.7s cubic-bezier(0.2, 0.8, 0.3, 1) both;
  }
  @keyframes titleIn {
    from { opacity: 0; transform: translateY(-16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .back-link {
    position: absolute; left: 0; top: 50%; transform: translateY(-50%);
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 12px; border-radius: 10px;
    background: var(--card); border: 1px solid var(--border);
    color: var(--text-dim); text-decoration: none;
    font-size: 0.78rem; font-weight: 700;
    transition: all 0.25s ease; z-index: 10;
  }
  .back-link:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-50%) translateX(-3px); }
  .theme-toggle {
    position: absolute; right: 0; top: 50%; transform: translateY(-50%);
    width: 56px; height: 30px; border-radius: 30px;
    background: var(--toggle-bg); border: 1px solid var(--toggle-border);
    cursor: pointer; transition: all 0.35s ease; z-index: 10;
  }
  .theme-toggle:hover { border-color: var(--accent); }
  .toggle-knob {
    position: absolute; top: 2px; left: 2px;
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--grad);
    box-shadow: 0 2px 8px var(--accent-glow-strong);
    transition: left 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.8rem;
  }
  html.light .toggle-knob { left: calc(100% - 26px); }
  .toggle-knob .k-ico { position: absolute; transition: opacity 0.3s, transform 0.4s; }
  .k-ico.moon { opacity: 1; } .k-ico.sun { opacity: 0; transform: rotate(-90deg); }
  html.light .k-ico.moon { opacity: 0; transform: rotate(90deg); }
  html.light .k-ico.sun { opacity: 1; transform: rotate(0deg); }

  .container { max-width: 1400px; margin: 0 auto; position: relative; z-index: 1; }

  /* ===== ПЕРЕКЛЮЧАТЕЛЬ ===== */
  .tabs {
    display: flex; flex-wrap: wrap; gap: 8px;
    justify-content: center;
    margin-bottom: 20px;
  }
  .tab {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 18px; border-radius: 12px;
    background: var(--card); border: 1px solid var(--border);
    color: var(--text-dim); cursor: pointer;
    font-size: 0.85rem; font-weight: 700;
    transition: all 0.25s ease;
    font-family: inherit;
    user-select: none;
  }
  .tab:hover { border-color: var(--accent); color: var(--text); }
  .tab.active {
    background: var(--grad);
    color: #fff;
    border-color: transparent;
    box-shadow: 0 4px 14px var(--accent-glow-strong);
  }
  .tab .tab-ico { font-size: 1.1rem; }

  /* ===== ИНФО-ПАНЕЛЬ ===== */
  .info-panel {
    background: linear-gradient(160deg, var(--card), var(--card-2));
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 22px;
    box-shadow: 0 6px 20px var(--shadow), inset 0 1px 0 var(--inset);
    margin-bottom: 20px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 16px;
    animation: cardIn 0.5s cubic-bezier(0.2, 0.8, 0.3, 1) both;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .info-icon {
    width: 56px; height: 56px; border-radius: 16px;
    background: var(--grad-soft); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.8rem; flex-shrink: 0;
  }
  .info-text { flex: 1; min-width: 200px; }
  .info-name { font-size: 1.2rem; font-weight: 800; color: var(--text); }
  .info-desc { font-size: 0.85rem; color: var(--text-dim); margin-top: 2px; }
  .info-stats {
    display: flex; flex-wrap: wrap; gap: 8px;
  }
  .stat-chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px; border-radius: 10px;
    background: var(--node-icon-bg);
    border: 1px solid var(--node-icon-border);
    font-size: 0.8rem; font-weight: 700;
    color: var(--text-dim);
  }
  .stat-chip .val { color: var(--accent); }
  .bonus-panel {
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px dashed var(--divider);
  width: 100%;
}
.bonus-title {
  font-size: 0.82rem;
  font-weight: 800;
  color: var(--accent);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.bonus-totals {
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px dashed var(--divider);
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.bonus-list {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.bonus-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 10px;
  border-radius: 9px;
  background: var(--grad-soft);
  border: 1px solid var(--border);
  font-size: 0.76rem;
  font-weight: 700;
  color: var(--text-dim);
}
.bonus-chip .b-val {
  color: var(--accent);
  font-weight: 900;
}
.bonus-empty {
  font-size: 0.78rem;
  color: var(--text-mut);
  font-style: italic;
}
  /* ===== ДЕРЕВО ===== */
  .tree-wrapper {
    position: relative;
    background:
      radial-gradient(900px 500px at 20% 15%, rgba(139,92,246,0.04), transparent 60%),
      radial-gradient(700px 500px at 85% 80%, rgba(34,197,94,0.04), transparent 60%),
      linear-gradient(160deg, var(--card), var(--card-2));
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 6px 20px var(--shadow), inset 0 1px 0 var(--inset);
    overflow: hidden;
    animation: cardIn 0.6s cubic-bezier(0.2, 0.8, 0.3, 1) both;
    min-height: 500px;
  }
  .tree-viewport {
    position: relative;
    width: 100%;
    height: 80vh;
    min-height: 500px;
    overflow: hidden;
    cursor: grab;
    user-select: none;
    touch-action: none;
  }
  .tree-viewport.grabbing { cursor: grabbing; }

  .tree-stage {
    position: absolute;
    top: 0; left: 0;
    transform-origin: 0 0;
    will-change: transform;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }

  .tree-svg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    overflow: visible;
    z-index: 1;
  }

  /* ===== SVG СВЯЗИ ===== */
  .tree-edge {
    stroke: var(--line);
    stroke-width: 3;
    fill: none;
    stroke-linecap: round;
    transition: stroke 0.3s ease, stroke-width 0.3s ease, opacity 0.3s ease;
  }
  .tree-edge.active {
    stroke: var(--line-hi);
    stroke-width: 5;
    filter: drop-shadow(0 0 8px var(--accent-glow-strong));
  }

  /* ===== ЛИНИИ УРОВНЕЙ ===== */
  .level-line {
    position: absolute;
    left: 0; right: 0;
    height: 2px;
    background: var(--level-line);
    opacity: 0.35;
    z-index: 0;
    pointer-events: none;
  }
  .level-line::before {
    content: '';
    position: absolute;
    left: 0; right: 0; top: -1px;
    height: 4px;
    background: repeating-linear-gradient(
      90deg,
      var(--level-line) 0px,
      var(--level-line) 8px,
      transparent 8px,
      transparent 16px
    );
    opacity: 0.5;
  }
  .level-label {
    position: absolute;
    left: 20px;
    top: -14px;
    padding: 4px 14px;
    background: var(--card);
    border: 1px solid var(--level-line);
    border-radius: 10px;
    font-size: 0.78rem;
    font-weight: 800;
    color: var(--level-text);
    z-index: 3;
    pointer-events: none;
    white-space: nowrap;
    box-shadow: 0 2px 8px var(--shadow);
  }
  .level-label .lvl-num {
    color: var(--accent);
  }

  /* ===== УЗЛЫ ===== */
  .tree-node {
    position: absolute;
    transform: translate(-50%, -50%);
    width: 140px;
    min-height: 100px;
    padding: 12px 10px 10px;
    background: var(--node-bg);
    border: 3px solid var(--node-border);
    border-radius: 14px;
    text-align: center;
    cursor: pointer;
    transition: box-shadow 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
    box-shadow: 0 4px 14px var(--shadow);
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    /* Ключевое: разрешаем touch-action для pointer events */
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  .tree-node:hover {
    box-shadow: 0 8px 24px var(--shadow), 0 0 20px var(--accent-glow);
    border-color: var(--accent);
    z-index: 5;
  }
  .tree-node.selected {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-glow-strong), 0 8px 24px var(--shadow);
    z-index: 6;
  }
  .tree-node.skill {
    border-color: #a78bfa;
    background: linear-gradient(160deg, #2a1f4a, #1f1838);
  }
  html.light .tree-node.skill {
    background: linear-gradient(160deg, #f3e8ff, #ede9fe);
  }
  .tree-node.buff {
    border-color: #4ade80;
    background: linear-gradient(160deg, #1a3a2a, #142a1f);
  }
  html.light .tree-node.buff {
    background: linear-gradient(160deg, #ecfdf5, #d1fae5);
  }

  .node-icon {
    font-size: 1.6rem;
    line-height: 1;
    display: block;
    pointer-events: none;
  }
  .node-name {
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--text);
    line-height: 1.2;
    overflow-wrap: anywhere;
    pointer-events: none;
  }
  .node-stats {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 3px;
    margin-top: 2px;
    pointer-events: none;
  }
  .node-stat {
    font-size: 0.65rem;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 6px;
    background: var(--node-icon-bg);
    border: 1px solid var(--node-icon-border);
    color: var(--text-dim);
  }
  .node-price {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    margin-top: 4px;
    padding: 3px 8px;
    border-radius: 8px;
    background: var(--price-bg);
    font-size: 0.7rem;
    font-weight: 800;
    color: var(--price-text);
    pointer-events: none;
  }
  .node-price .price-ico { font-size: 0.8rem; }

  /* ===== ТУЛТИП ===== */
  .tooltip {
    position: fixed;
    z-index: 9999;
    padding: 14px 16px;
    background: var(--tooltip-bg);
    border: 1px solid var(--tooltip-border);
    border-radius: 12px;
    box-shadow: 0 8px 30px var(--tooltip-shadow);
    font-size: 0.82rem;
    line-height: 1.5;
    color: var(--text);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s ease, transform 0.15s ease;
    word-break: break-word;
    transform: scale(0.96);
  }
  .tooltip.show { 
    opacity: 1; 
    transform: scale(1);
  }
  .tooltip-title {
    font-weight: 800;
    font-size: 0.9rem;
    margin-bottom: 6px;
    color: var(--accent);
  }
  .tooltip-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 3px;
  }
  .tooltip-row .label { color: var(--text-mut); }
  .tooltip-row .value { font-weight: 700; color: var(--text); }
  .tooltip-desc {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed var(--divider);
    font-size: 0.78rem;
    color: var(--text-dim);
  }
  /* Стрелка тултипа */
  .tooltip::after {
    content: '';
    position: absolute;
    width: 10px;
    height: 10px;
    background: var(--tooltip-bg);
    border: 1px solid var(--tooltip-border);
    transform: rotate(45deg);
  }
  .tooltip[data-arrow="right"]::after {
    left: -6px;
    top: 50%;
    margin-top: -5px;
    border-right: none;
    border-top: none;
  }
  .tooltip[data-arrow="left"]::after {
    right: -6px;
    top: 50%;
    margin-top: -5px;
    border-left: none;
    border-bottom: none;
  }
  .tooltip[data-arrow="bottom"]::after {
    top: -6px;
    left: 50%;
    margin-left: -5px;
    border-right: none;
    border-bottom: none;
  }
  .tooltip[data-arrow="top"]::after {
    bottom: -6px;
    left: 50%;
    margin-left: -5px;
    border-left: none;
    border-top: none;
  }

  /* ===== ФУТЕР ===== */
  .footer {
    max-width: 1400px; margin: 40px auto 0;
    padding: 30px 16px 20px;
    border-top: 1px solid var(--divider);
    text-align: center; color: var(--text-mut); font-size: 0.85rem;
  }
  .footer-links { display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; margin-bottom: 18px; }
  .footer-links a { color: var(--text-dim); text-decoration: none; font-weight: 600; transition: color 0.2s ease; }
  .footer-links a:hover { color: var(--accent); }
  .footer-dev { margin-top: 12px; padding-top: 16px; border-top: 1px dashed var(--divider); font-size: 0.82rem; }
  .footer-dev a { color: var(--accent); text-decoration: none; font-weight: 700; }

  @media (max-width: 560px) {
    body { padding: 14px 8px calc(20px + env(safe-area-inset-bottom)); }
    .header { min-height: 44px; margin-bottom: 14px; }
    .theme-toggle { width: 50px; height: 28px; }
    .toggle-knob { width: 22px; height: 22px; font-size: 0.72rem; }
    html.light .toggle-knob { left: calc(100% - 24px); }
    .back-link { padding: 6px 10px; font-size: 0.72rem; }
    .tab { padding: 8px 14px; font-size: 0.78rem; }
    .tree-viewport { height: 70vh; min-height: 420px; }
    .tree-node { width: 110px; min-height: 85px; padding: 8px 6px 8px; }
    .node-icon { font-size: 1.3rem; }
    .node-name { font-size: 0.65rem; }
    .node-price { font-size: 0.65rem; padding: 2px 6px; }
    .info-panel { padding: 14px 16px; }
    .info-icon { width: 46px; height: 46px; font-size: 1.5rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }
  html.light body {
    background:
      radial-gradient(1000px 500px at 50% -10%, var(--glow-1), transparent 60%),
      radial-gradient(700px 400px at 90% 110%, var(--glow-2), transparent 70%),
      linear-gradient(180deg, var(--bg-1), var(--bg-2));
  }
  html.light .tree-wrapper,
  html.light .info-panel {
    box-shadow: 0 1px 0 rgba(255, 255, 255, 1) inset, 0 6px 20px var(--shadow-soft), 0 2px 6px rgba(70, 45, 15, 0.08);
  }
</style>
</head>
<body>

  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="mandarins-bg" id="mandarinsBg"></div>

  <div class="header">
    <a href="index.html" class="back-link">← На главную</a>
    <h1 class="title">🌳 Древо талантов</h1>
    <button class="theme-toggle" id="themeToggle" aria-label="Переключить тему" type="button">
      <span class="toggle-knob">
        <span class="k-ico moon">🌙</span>
        <span class="k-ico sun">☀️</span>
      </span>
    </button>
  </div>

  <div class="container">

    <!-- ПЕРЕКЛЮЧАТЕЛЬ -->
    <div class="tabs" id="tabs"></div>

    <!-- ИНФО-ПАНЕЛЬ -->

    stName:"Киви-тян",
    dates: [
    ["Вы гуляете с Киви-тян по парку. Тёплый вечер, воздух пахнет травой и чем-то сладким. У продавца - связка мыльных пузырей, которые переливаются на солнце. Киви-тян смотрит на них дольше, чем следовало бы, потом быстро отводит взгляд: «Глупости какие...» Но её пальцы сжимают вашу руку чуть сильнее. Что вы сделаете?",["Куплю ей набор пузырей","Скажу, что это дорого","Предложу пройти мимо"],1],
    ["Вы гуляете с Киви-тян по парку. Она вдруг замедляет шаг, потом останавливается совсем. «Прости... я немного устала. Можно... посидеть?» - тихо говорит она, и вы замечаете, как она бледна. Она боится, что вы подумаете, будто она слабая. Что вы сделаете?",["Присяду с ней на лавочку","Предложу дойти до выхода","Скажу потерпеть"],1],
    ["Вы гуляете с Киви-тян по парку. Она долго смотрит на кафе с мороженым, потом на вас, потом снова на кафе. «Я... не хочу. Правда. Просто...» - она не заканчивает фразу. Её щёки краснеют. Что вы сделаете?",["Куплю ей мороженое","Куплю ей пирожное","Скажу, что потом"],1],
    ["Вы гуляете с Киви-тян по парку. У дорожки сидит маленький щенок - лохматый, с грустными глазами. Киви-тян делает шаг к нему, потом отступает. «Он... он может укусить?» - спрашивает она, но в её глазах - желание погладить. Что вы сделаете?",["Помогу ей погладить щенка","Скажу не трогать его","Пройду мимо"],1],
    ["Вы гуляете с Киви-тян по парку. Вдруг с дерева срывается стая воробьёв - шумная, хлопающая крыльями прямо у её лица. Киви-тян вскрикивает, закрывает голову руками и прижимается к вам. Её сердце колотится. Что вы сделаете?",["Успокою её и обниму","Скажу, что нечего бояться","Прогоню птиц"],1],
    ["Вы пришли домой к Киви-тян. Она долго стоит у двери, не решаясь войти. «Родители... они могут быть против. Они не знают, что я... что ты...» - шепчет она, глядя в пол. Что вы сделаете?",["Скажу, что всё честно, и войду с ней","Уйду","Сделаю вид, что не слышал"],1],
    ["Вы пришли домой к Киви-тян. На улице разыгрался сильный дождь - стена воды, гром, ветер. Уходить поздно и страшно. Киви-тян смотрит в окно, потом на вас. «Может... останешься? Я постелю тебе. Только... не подумай ничего плохого», - тихо говорит она. Что вы сделаете?",["Останусь","Скажу, что это неудобно","Попробую уйти"],1],
    ["Вы остались на ночь у Киви-тян. Дом маленький, уютный, пахнет травами. Она смущённо спрашивает: «Где ты... где ты будешь спать?» Её голос дрожит. Она явно не знает, как правильно. Что вы выберете?",["На полу","На диване","В кресле"],2],
    ["Вы остались у Киви-тян. Её мама просит сходить в магазин - «гость, помоги, будь добр». Киви-тян смущённо смотрит на вас и шепчет: «Купи... киви. Пожалуйста. Я... я люблю их.» Что вы купите?",["Хлеб","Молоко","Киви"],3],
    ["Вы пришли домой к Киви-тян. На пороге вас встречает её отец - высокий, серьёзный, с тяжёлым взглядом. Киви-тян тихо прячется за вашу спину. Она боится, что он вас прогонит. Что вы сделаете?",["Вежливо поздороваюсь","Скажу, что спешу","Пройду молча"],1],
    ["Вы в ресторане с Киви-тян. Она смущённо уткнулась в меню, не зная, что выбрать. «Я... я никогда здесь не была», - шепчет она. Вы понимаете, что она ждёт вашего решения. Что вы выберете?",["Сок яблочный","Сок апельсиновый","Сок киви"],3],
    ["Вы в ресторане с Киви-тян. Она вдруг замирает и тихо спрашивает: «Прости... а где здесь... туалет? Я не знаю...» Ей стыдно, что она не знает, и она боится, что вы подумаете, будто она невоспитанная. Что вы сделаете?",["Проведу её","Позову официанта","Скажу самой найти"],1],
    ["Вы в ресторане с Киви-тян. В её еде оказывается слишком остро. Она краснеет, слёзы наворачиваются на глаза, но она молчит - не хочет жаловаться. Что вы сделаете?",["Поменяю блюдо","Скажу потерпеть","Засмеюсь"],1],
    ["Вы в ресторане с Киви-тян. Она стеснительно одёргивает платье - оно немного велико, но она всё равно надела его для вас. Она ждёт вашей реакции. Что вы сделаете?",["Скажу комплимент","Сделаю вид, что не заметил","Начну смеяться"],1],
    ["Вы в ресторане с Киви-тян. Она случайно проливает сок на скатерть. Пятно расползается, как кровь. Киви-тян бледнеет и краснеет одновременно. «Прости... прости... я такая неуклюжая...» - шепчет она. Что вы сделаете?",["Помогу убрать и успокою","Скажу, что ничего страшного","Засмеюсь"],1],
    ["Вы на пляже с Киви-тян. Она стоит у самой кромки воды, боясь зайти. Волны лижут песок, а она дрожит. «Я... я не умею плавать. И боюсь глубины», - тихо признаётся она. Что вы сделаете?",["Возьму её за руку и поведу","Скажу, чтобы не боялась","Оставлю её на берегу"],1],
    ["Вы на пляже с Киви-тян. К ней подходят несколько ребят и просят номер телефона. Она краснеет, отступает назад и смотрит на вас - ищет защиты. Что вы сделаете?",["Скажу, что она не даст номер","Скажу, чтобы она сама решала","Уйду"],1],
    ["Вы на пляже с Киви-тян. Она робко протягивает вам тюбик крема: «Можно... намажешь? Я сама не могу... спину.» Её голос дрожит, щёки горят. Что вы сделаете?",["Соглашусь и помогу","Откажу","Скажу, чтобы сама"],1],
    ["Вы на пляже с Киви-тян. Она смущённо показывает новый купальник - скромный, но очень ей идёт. Она не говорит ни слова, но ждёт. Что вы сделаете?",["Скажу искренний комплимент","Сделаю вид, что не заметил","Скажу, что некрасиво"],1],
    ["Вы на пляже с Киви-тян. К вам подходит женщина и хвалит её: «Какая милая девушка!» Киви-тян краснеет и прячет лицо у вас на плече. Что вы сделаете?",["Скажу спасибо","Сделаю вид, что не слышал","Уйду"],1],
    ["Вы на шоппинге с Киви-тян. Она застенчиво смотрит на витрину с заколками - маленькие киви из зелёного камня. Она не просит, просто смотрит. Что вы сделаете?",["Куплю ей заколку","Скажу, что дорого","Пройду мимо"],1],
    ["Вы на шоппинге с Киви-тян. Она робко просит помочь с сумками. «Прости... я не хочу тебя нагружать, но... они такие тяжёлые», - шепчет она, глядя в пол. Что вы сделаете?",["Соглашусь и понесу","Скажу, чтобы несла сама","Уйду"],1],
    ["Вы на шоппинге с Киви-тян. Ей вдруг становится плохо - она бледнеет и хватается за стойку. «Прости... мне нужно... воды...» - тихо просит она. Что вы сделаете?",["Куплю воду","Скажу потерпеть","Уйду"],1],
    ["Вы на шоппинге с Киви-тян. Она смущённо показывает новый купальник. Перед ней три варианта. «Какой... какой мне подойдёт?» - спрашивает она, глядя на вас с надеждой. Что вы выберете?",["Скромный","Милый","Школьный"],2],
    ["Вы на шоппинге с Киви-тян. Она тихо говорит: «Я хочу пить...» Вы знаете, что она выберет, если бы решала сама. Что вы купите?",["Яблочный сок","Апельсиновый сок","Киви-сок"],3]

    description:"🥝Киви-тян\n🎉День рождения: 17 марта\n\nСтеснительная и молчаливая жрица. Самая младшая из всех сестёр. Вдохновляется своими сёстрами, но боится об этом рассказывать. Очень любит коллекционировать красивые игрушки. В будущем мечтает стать достойной жрицей, и боится, что её никто не полюбит из-за её маленького размера во всех смыслах. Эта особенность досталась её от мамы, которая и сама была невысокая.",

    return (type == 1) ? num+"%💥" : (type == 2) ? "-"+num+"%🛡 (🗡⚔)" : (type == 3) ? "-"+num+"%🛡 (🔮⚔)" : (type == 4) ? num + "🛡 (🗡)" : (type == 5) ? num + "🛡 (🔮)" : (type == 6) ? num+"%💨" : (type == 7) ? num+"%💢" : 
    (type == 8) ? num+"%💥 (💢)" : (type == 9) ? num+"%💥 (🔮)" : (type == 10) ? num+"💥" : (type == 11) ? num+"%🎯" : (type == 12) ? num+"♥️" : (type == 13) ? num+"%♥️" : (type == 14) ? num+"💙" : 
    (type == 15) ? num+"%💙" : (type == 16) ? num+"💙/ч" : (type == 17) ? "%🛡 (🗡)" : (type == 18) ? "%🛡 (🔮)" :  "";
}

function getNodeInfo(node, treeType, waifuId = 0) {
    let name = "Неизвестно";
    let desc = "";
    let stats = [];
    let price = "";
    let priceIcon = "";

    if (node.type === 1) {
        name = "Усиление";
        for (let i = 0; i < node.stats.length; i += 2) {
            const type = node.stats[i];
            const num = node.stats[i+1];
            stats.push(getFightBoostName(type, num));
        }
        desc = "Постоянное улучшение характеристик";
        price = node.points;
        priceIcon = treeType === 'st' ? '🎖' : '🩷';
    } else if (node.type === 2) {
        name = "Бонус вайфу";
        const bonusId = node.stats[0];
        const bonusNames = ["⏳Время роста ","🍉Макс. съесть +","🥜Семена и 🥝 с разлущения +","🍋Шанс и 🍊 с 🍋 +"]
        name = bonusNames[waifuId-1]+node.stats[0]+"%" || `Бонус #${bonusId}`;
        desc = "Увеличивает бонус вайфу";
        price = node.points;
        priceIcon = treeType === 'st' ? '🎖' : '🩷';
    } else if (node.type === 3) {
        const skillId = node.stats[0];
        const skill = waifuSkills.find(s => s.id === skillId);
        if (skill) {
            name = skill.name;
            desc = skill.txts ? skill.txts.join('') : "Боевой навык";
        } else {
            name = `Скилл #${skillId}`;
            desc = "Боевой навык";
        }
        price = node.points;
        priceIcon = treeType === 'st' ? '🎖' : '🩷';
    } else if (node.type === 0) {
        name = "Корень";
        desc = "Начало дерева";
        price = node.points || 0;
        priceIcon = '';
    }

    return { name, desc, stats, price, priceIcon };
}

/* ============================================================
   ВЫЧИСЛЕНИЕ ПОЗИЦИЙ
   ============================================================ */
function computeTreePositions(tree) {
    const nodes = {};
    tree.forEach(n => { nodes[n.id] = n; });
    
    const root = tree.find(n => n.type === 0);
    if (!root) return {};
    
    const levels = {};
    const parent = {};
    const queue = [{ id: root.id, level: 0, parentId: null }];
    const visited = new Set();
    levels[root.id] = 0;
    parent[root.id] = null;
    
    while (queue.length > 0) {
        const { id, level, parentId } = queue.shift();
        if (visited.has(id)) continue;
        visited.add(id);
        levels[id] = level;
        parent[id] = parentId;
        
        const node = nodes[id];
        if (!node) continue;
        
        (node.next || []).forEach(nextId => {
            if (!visited.has(nextId)) {
                queue.push({ id: nextId, level: level + 1, parentId: id });
            }
        });
    }
    
    const levelGroups = {};
    Object.entries(levels).forEach(([id, lvl]) => {
        if (!levelGroups[lvl]) levelGroups[lvl] = [];
        levelGroups[lvl].push(Number(id));
    });
    
    Object.values(levelGroups).forEach(g => g.sort((a, b) => a - b));
    
    const positions = {};
    const H_SPACING = 200;
    const V_SPACING = 180;
    const X_OFFSET = 1000;
    const Y_OFFSET = 150;
    
    positions[root.id] = { x: X_OFFSET, y: Y_OFFSET };
    
    const maxLevel = Math.max(...Object.keys(levelGroups).map(Number), 0);
    
    for (let lvl = 1; lvl <= maxLevel; lvl++) {
        const ids = levelGroups[lvl] || [];
        
        const desiredX = {};
        ids.forEach(id => {
            const p = parent[id];
            if (p !== null && positions[p]) {
                desiredX[id] = positions[p].x;
            } else {
                desiredX[id] = X_OFFSET;
            }
        });
        
        ids.sort((a, b) => (desiredX[a] || 0) - (desiredX[b] || 0));
        
        let prevX = -Infinity;
        ids.forEach(id => {
            let x = desiredX[id] || X_OFFSET;
            
            if (x < prevX + H_SPACING) {
                x = prevX + H_SPACING;
            }
            
            positions[id] = { x: x, y: Y_OFFSET + lvl * V_SPACING };
            prevX = x;
        });
        
        if (ids.length > 0) {
            const avgDesired = ids.reduce((s, id) => s + (desiredX[id] || X_OFFSET), 0) / ids.length;
            const avgActual = ids.reduce((s, id) => s + positions[id].x, 0) / ids.length;
            const shift = avgDesired - avgActual;
            
            ids.forEach(id => {
                positions[id].x += shift;
            });
        }
    }
    
    let minX = Infinity;
    Object.values(positions).forEach(p => { minX = Math.min(minX, p.x); });
    Object.keys(positions).forEach(id => {
        positions[id].x -= minX - 100;
    });
    
    return positions;
}

        treeStage.appendChild(el);

/* ============================================================
   АВТОПОДГОНКА МАСШТАБА
   ============================================================ */
function autoFitTree() {
    const isPhone = window.matchMedia('(max-width: 560px)').matches
                 || window.matchMedia('(hover: none) and (pointer: coarse)').matches;
    if (!isPhone) return;

    const vw = treeViewport.clientWidth;
    const vh = treeViewport.clientHeight;
    const sw = treeStage.offsetWidth;
    const sh = treeStage.offsetHeight;
    if (!sw || !sh) return;

    const fitW = vw / sw;
    const fitH = vh / sh;
    let fitScale = Math.min(fitW, fitH);

    if (fitScale >= 1) return;

    fitScale = Math.max(0.75, fitScale);

    currentScale = fitScale;
    applyTransform();
}

/* ============================================================
   ТУЛТИП — УМНОЕ ПОЗИЦИОНИРОВАНИЕ
   ============================================================ */
function showTooltipForNode(nodeEl, info, node, priceIcon) {
    const rect = nodeEl.getBoundingClientRect();
    
    /* Адаптивная ширина тултипа */
    const nodeWidth = nodeEl.offsetWidth;
    const tooltipMaxWidth = Math.max(180, Math.min(340, nodeWidth + 60));
    
    tooltip.style.visibility = 'hidden';
    tooltip.classList.add('show');
    tooltip.style.maxWidth = tooltipMaxWidth + 'px';
    
    const lvlInfo = node.lvl > 1 ? `<div class="tooltip-row"><span class="label">Требуется Lv</span><span class="value">${node.lvl}</span></div>` : '';
    
    tooltip.innerHTML = `
        <div class="tooltip-title">${info.name}</div>
        <div class="tooltip-row"><span class="label">Тип</span><span class="value">${
            node.type === 0 ? 'Корень' :
            node.type === 1 ? 'Бафф' :
            node.type === 2 ? 'Бонус вайфу' :
            node.type === 3 ? 'Скилл' : '???'
        }</span></div>
        ${lvlInfo}
        ${info.price ? `<div class="tooltip-row"><span class="label">Цена</span><span class="value">${priceIcon} ${info.price}</span></div>` : ''}
        ${info.stats.length ? `<div class="tooltip-row"><span class="label">Эффект</span><span class="value">${info.stats.join(', ')}</span></div>` : ''}
        <div class="tooltip-desc">${info.desc}</div>
    `;
    
    tooltip.dataset.nodeId = node.id;
    
    /* Измеряем тултип после установки контента */
    const tw = tooltip.offsetWidth || tooltipMaxWidth;
    const th = tooltip.offsetHeight || 160;
    const margin = 14;
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    
    /* Пробуем позиции в порядке приоритета: справа, слева, снизу, сверху */
    let x, y, arrow;
    
    const spaceRight = vw - rect.right - margin;
    const spaceLeft = rect.left - margin;
    const spaceBottom = vh - rect.bottom - margin;
    const spaceTop = rect.top - margin;
    
    if (spaceRight >= tw) {
        /* Справа от блока */
        x = rect.right + margin;
        y = rect.top + rect.height / 2 - th / 2;
        arrow = 'right';
    } else if (spaceLeft >= tw) {
        /* Слева от блока */
        x = rect.left - tw - margin;
        y = rect.top + rect.height / 2 - th / 2;
        arrow = 'left';
    } else if (spaceBottom >= th) {
        /* Снизу от блока — по центру */
        x = rect.left + rect.width / 2 - tw / 2;
        y = rect.bottom + margin;
        arrow = 'bottom';
    } else if (spaceTop >= th) {
        /* Сверху от блока — по центру */
        x = rect.left + rect.width / 2 - tw / 2;
        y = rect.top - th - margin;
        arrow = 'top';
    } else {
        /* Fallback: снизу с максимальным местом */
        x = rect.left + rect.width / 2 - tw / 2;
        y = Math.min(rect.bottom + margin, vh - th - 8);
        arrow = 'bottom';
    }
    
    /* Финальные корректировки по краям экрана */
    x = Math.max(8, Math.min(vw - tw - 8, x));
    y = Math.max(8, Math.min(vh - th - 8, y));
    
    tooltip.style.left = x + 'px';
    tooltip.style.top = y + 'px';
    tooltip.dataset.arrow = arrow;
    tooltip.style.visibility = 'visible';
}

function hideTooltip() {
    tooltip.classList.remove('show');
    tooltip.dataset.nodeId = '';
}

/* ============================================================
   ТРАНСФОРМАЦИИ
   ============================================================ */
function applyTransform() {
    treeStage.style.transform = `translate(${currentTx}px, ${currentTy}px) scale(${currentScale})`;
}

function clampTransform() {
    const vw = treeViewport.clientWidth;
    const vh = treeViewport.clientHeight;
    const sw = treeStage.offsetWidth * currentScale;
    const sh = treeStage.offsetHeight * currentScale;
    if (sw <= vw) currentTx = (vw - sw) / 2;
    else currentTx = Math.min(0, Math.max(vw - sw, currentTx));
    if (sh <= vh) currentTy = (vh - sh) / 2;
    else currentTy = Math.min(0, Math.max(vh - sh, currentTy));
}

function centerOnRoot() {
    const rootNode = treeStage.querySelector('.tree-node');
    if (!rootNode) return;
    
    const rootX = parseFloat(rootNode.style.left) || 0;
    const rootY = parseFloat(rootNode.style.top) || 0;
    
    const vw = treeViewport.clientWidth;
    const vh = treeViewport.clientHeight;
    
    currentTx = vw / 2 - rootX * currentScale;
    currentTy = vh / 3 - rootY * currentScale;
    clampTransform();
    applyTransform();
}

function zoomAt(px, py, factor) {
    const newScale = Math.min(2.0, Math.max(0.3, currentScale * factor));
    if (newScale === currentScale) return;
    const wx = (px - currentTx) / currentScale;
    const wy = (py - currentTy) / currentScale;
    currentScale = newScale;
    currentTx = px - wx * currentScale;
    currentTy = py - wy * currentScale;
    clampTransform();
    applyTransform();
}

/* ============================================================
   УПРАВЛЕНИЕ ПАНОРАМОЙ — РАБОТАЕТ С БЛОКОВ
   ============================================================ */
function handlePointerDown(e) {
    if (e.button !== undefined && e.button !== 0 && e.pointerType === 'mouse') return;
    if (e.target.closest('.zoom-btn')) return;

    /* Игнорируем второй палец при мультитаче */
    if (e.pointerType === 'touch' && e.isPrimary === false) return;

    isPanning = true;
    panMoved = false;
    panStart = { x: e.clientX, y: e.clientY, tx: currentTx, ty: currentTy };
    activePointer = e.pointerId;

    try { treeViewport.setPointerCapture(e.pointerId); } catch(_) {}
    treeViewport.classList.add('grabbing');
}

treeViewport.addEventListener('pointerdown', handlePointerDown);

treeViewport.addEventListener('pointermove', (e) => {
    if (!isPanning || e.pointerId !== activePointer) return;
    const dx = e.clientX - panStart.x;
    const dy = e.clientY - panStart.y;
    
    /* Порог 4px для более отзывчивого определения панорамирования */
    if (!panMoved && (Math.abs(dx) > 4 || Math.abs(dy) > 4)) {
        panMoved = true;
        hideTooltip();
    }
    
    if (panMoved) {
        currentTx = panStart.tx + dx;
        currentTy = panStart.ty + dy;
        clampTransform();
        applyTransform();
        e.preventDefault();
    }
}, { passive: false });

function endPointer(e) {
    if (!isPanning || e.pointerId !== activePointer) return;
    treeViewport.classList.remove('grabbing');
    try { treeViewport.releasePointerCapture(e.pointerId); } catch(_) {}
    isPanning = false;
    activePointer = null;
    panStart = null;
}
treeViewport.addEventListener('pointerup', endPointer);
treeViewport.addEventListener('pointercancel', endPointer);

/* ============================================================
   ОБРАБОТКА КЛИКОВ ПО УЗЛАМ
   ============================================================ */
treeViewport.addEventListener('click', (e) => {
    /* Если панорамировали — не считаем это кликом */
    if (panMoved) {
        panMoved = false;
        return;
    }

    const nodeEl = e.target.closest('.tree-node');

    /* Клик по пустому месту — скрываем тултип на телефоне */
    if (!nodeEl) {
        if (!hasHover) hideTooltip();
        return;
    }

    /* На ПК ховер уже показывает тултип — клик не нужен */
    if (hasHover) return;

    /* На телефоне — переключаем тултип */
    e.stopPropagation();
    const nodeId = nodeEl.dataset.id;
    
    if (tooltip.dataset.nodeId === nodeId && tooltip.classList.contains('show')) {
        hideTooltip();
    } else {
        const node = findNodeById(currentTree, nodeId);
        if (node) {
            const info = getNodeInfo(node, treesData[currentTree].type, treesData[currentTree].waifuId ?? 0);
            const priceIcon = treesData[currentTree].priceIcon;
            showTooltipForNode(nodeEl, info, node, priceIcon);
        }
    }
});

/* Вспомогательная функция поиска узла по id в текущем дереве */
function findNodeById(treeKey, nodeId) {
    const data = treesData[treeKey];
    if (!data) return null;
    const numId = Number(nodeId);
    return data.tree.find(n => n.id === numId) || null;
}

/* ============================================================
   ПИНЧ-ЗУМ (тач)
   ============================================================ */
let pinchStart = null;

treeViewport.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
        const [a, b] = e.touches;
        pinchStart = {
            dist: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY),
            cx: (a.clientX + b.clientX) / 2,
            cy: (a.clientY + b.clientY) / 2,
            scale: currentScale,
            tx: currentTx,
            ty: currentTy
        };
        isPanning = false;
        activePointer = null;
        panMoved = true; /* Блокируем клик после пинча */
        hideTooltip();
    }
}, { passive: true });

treeViewport.addEventListener('touchmove', (e) => {
    if (e.touches.length === 2 && pinchStart) {
        e.preventDefault();
        const [a, b] = e.touches;
        const dist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
        const factor = dist / pinchStart.dist;
        const newScale = Math.min(2.0, Math.max(0.3, pinchStart.scale * factor));
        
        const rect = treeViewport.getBoundingClientRect();
        const px = pinchStart.cx - rect.left;
        const py = pinchStart.cy - rect.top;
        
        const wx = (px - pinchStart.tx) / pinchStart.scale;
        const wy = (py - pinchStart.ty) / pinchStart.scale;
        
        currentScale = newScale;
        currentTx = px - wx * currentScale;
        currentTy = py - wy * currentScale;
        clampTransform();
        applyTransform();
    }
}, { passive: false });

treeViewport.addEventListener('touchend', (e) => {
    if (e.touches.length < 2) {
        pinchStart = null;
        /* Сбрасываем panMoved после завершения пинча, но с задержкой,
           чтобы click не сработал */
        setTimeout(() => { panMoved = false; }, 50);
    }
});

treeViewport.addEventListener('wheel', (e) => {
    e.preventDefault();
    const rect = treeViewport.getBoundingClientRect();
    const px = e.clientX - rect.left;
    const py = e.clientY - rect.top;
    const factor = e.deltaY < 0 ? 1.12 : 1/1.12;
    zoomAt(px, py, factor);
}, { passive: false });

window.addEventListener('resize', () => {
    clampTransform();
    applyTransform();
});

/* Скрываем тултип при скролле страницы */
window.addEventListener('scroll', () => {
    if (tooltip.classList.contains('show')) hideTooltip();
}, { passive: true });

/* ============================================================
   ВКЛАДКИ
   ============================================================ */
function renderTabs() {
    tabsContainer.innerHTML = '';
    Object.entries(treesData).forEach(([key, data]) => {
        const tab = document.createElement('button');
        tab.className = 'tab' + (key === currentTree ? ' active' : '');
        tab.dataset.key = key;
        tab.innerHTML = `<span class="tab-ico">${data.icon}</span> ${data.name}`;
        tab.addEventListener('click', () => {
            currentTree = key;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            hideTooltip();
            renderTree(key);
        });
        tabsContainer.appendChild(tab);
    });
}

/* ============================================================
   СТАРТ
   ============================================================ */
renderTabs();
renderTree('st');

/* ============================================================
   ТЕМА
   ============================================================ */
const themeToggle = document.getElementById('themeToggle');
const root = document.documentElement;
const mql = window.matchMedia('(prefers-color-scheme: light)');
function getStoredTheme() { try { return localStorage.getItem('theme'); } catch(e) { return null; } }
function storeTheme(t) { try { localStorage.setItem('theme', t); } catch(e) {} }
function applyTheme(t) {
    if (t === 'light') {
        root.classList.add('light'); root.style.colorScheme = 'light';
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#fff8f0');
    } else {
        root.classList.remove('light'); root.style.colorScheme = 'dark';
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#0d1117');
    }
}
function initTheme() {
    const s = getStoredTheme();
    if (s === 'light' || s === 'dark') applyTheme(s);
    else applyTheme(mql.matches ? 'light' : 'dark');
}
function toggleTheme() {
    const isLight = root.classList.contains('light');
    applyTheme(isLight ? 'dark' : 'light');
    storeTheme(isLight ? 'dark' : 'light');
}
themeToggle.addEventListener('click', toggleTheme);
themeToggle.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleTheme(); }
});
mql.addEventListener('change', (e) => { if (!getStoredTheme()) applyTheme(e.matches ? 'light' : 'dark'); });
initTheme();

/* ============================================================
   ПРОГРЕСС-БАР
   ============================================================ */
const progressFill = document.getElementById('progressFill');
window.addEventListener('scroll', () => {
    const h = document.documentElement.scrollHeight - window.innerHeight;
    progressFill.style.width = (h > 0 ? (window.scrollY / h) * 100 : 0) + '%';
}, { passive: true });

/* ============================================================
   ФОН
   ============================================================ */
(function() {
    const bg = document.getElementById('mandarinsBg');
    const count = window.innerWidth < 600 ? 10 : 16;
    const emojis = ['🍊','🌳','💖','⚔️','🌟','💪','🔥'];
    for (let i = 0; i < count; i++) {
        const m = document.createElement('span');
        m.className = 'mandarin-float';
        m.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        m.style.left = Math.random() * 100 + '%';
        m.style.fontSize = (1 + Math.random() * 1.4) + 'rem';
        m.style.animationDuration = (18 + Math.random() * 14) + 's';
        m.style.animationDelay = (Math.random() * 22 + 22) + 's';
        bg.appendChild(m);
    }
})();
