<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="color-scheme" content="dark light">
<title>Рецепты · крафт</title>
<style>
  /* ============ ТЁМНАЯ ТЕМА (по умолчанию) ============ */
  :root {
    --bg-grad-1: #121821;
    --bg-grad-2: #0a0e14;
    --card: #161d27;
    --card-grad: #131a23;
    --border: #263140;
    --border-hover: #3d4f66;
    --slot: #1c2530;
    --slot-grad: #18202a;
    --slot-empty: #12181f;
    --text: #e8eef6;
    --text-dim: #93a3b8;
    --text-muted: #5f7086;
    --accent: #8ab4f8;
    --accent-2: #a78bfa;
    --accent-glow: rgba(138, 180, 248, 0.14);
    --shadow: rgba(0, 0, 0, 0.5);
    --shadow-soft: rgba(0, 0, 0, 0.25);
    --row-h: 44px;
    --radius: 16px;
    --toggle-bg: #1f2a36;
    --toggle-border: #2f3d4f;
    --divider: #2a3644;
    --glow-1: rgba(138, 180, 248, 0.10);
    --glow-2: rgba(167, 139, 250, 0.05);
    --pill-bg: rgba(255, 255, 255, 0.04);
    --icon-bg-1: #1c2530;
    --icon-bg-2: #18202a;
    --inset-light: rgba(255, 255, 255, 0.04);
  }

  /* ============ СВЕТЛАЯ ТЕМА — контрастная и тёплая ============ */
  html.light {
    --bg-grad-1: #eef2f8;
    --bg-grad-2: #e2e8f2;
    --card: #ffffff;
    --card-grad: #f7f9fc;
    --border: #b8c4d4;
    --border-hover: #7a8ba3;
    --slot: #edf1f7;
    --slot-grad: #e3e9f1;
    --slot-empty: #dde4ed;
    --text: #17222f;
    --text-dim: #4a5b6e;
    --text-muted: #6b7c91;
    --accent: #2c5d8f;
    --accent-2: #6d47b3;
    --accent-glow: rgba(44, 93, 143, 0.14);
    --shadow: rgba(30, 50, 80, 0.12);
    --shadow-soft: rgba(30, 50, 80, 0.08);
    --toggle-bg: #d0d9e6;
    --toggle-border: #a8b6c8;
    --divider: #b8c4d4;
    --glow-1: rgba(44, 93, 143, 0.07);
    --glow-2: rgba(109, 71, 179, 0.04);
    --pill-bg: rgba(30, 50, 80, 0.05);
    --icon-bg-1: #edf1f7;
    --icon-bg-2: #e3e9f1;
    --inset-light: rgba(255, 255, 255, 0.6);
  }

  /* ============ БАЗА ============ */
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -10%, var(--glow-1), transparent 60%),
      radial-gradient(800px 500px at 90% 110%, var(--glow-2), transparent 70%),
      linear-gradient(180deg, var(--bg-grad-1), var(--bg-grad-2));
    background-attachment: fixed;
    color: var(--text);
    padding: 32px 16px calc(40px + env(safe-area-inset-bottom));
    padding-top: calc(28px + env(safe-area-inset-top));
    min-height: 100vh;
    min-height: 100dvh;
    line-height: 1.4;
    transition: background 0.5s ease, color 0.35s ease;
  }

  /* ============ ШАПКА ============ */
  .header {
    position: relative;
    max-width: 1240px;
    margin: 0 auto 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 56px;
  }

  h1 {
    font-size: clamp(1.5rem, 4.5vw, 2.1rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-align: center;
    animation: titleIn 0.7s cubic-bezier(0.2, 0.8, 0.3, 1) both;
  }

  @keyframes titleIn {
    from { opacity: 0; transform: translateY(-12px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* ============ ТОГЛ ТЕМЫ ============ */
  .theme-toggle {
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 56px;
    height: 30px;
    border-radius: 30px;
    background: var(--toggle-bg);
    border: 1px solid var(--toggle-border);
    cursor: pointer;
    transition: background 0.4s ease, border-color 0.4s ease, box-shadow 0.3s ease;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.08);
    z-index: 10;
  }

  .theme-toggle:hover {
    border-color: var(--border-hover);
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.08), 0 0 20px var(--accent-glow);
  }

  .theme-toggle:active { transform: translateY(-50%) scale(0.96); }

  .toggle-knob {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    transition: left 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.8rem;
    line-height: 1;
  }

  html.light .toggle-knob { left: calc(100% - 26px); }

  .toggle-knob .knob-icon {
    position: absolute;
    transition: opacity 0.3s ease, transform 0.4s ease;
  }

  .knob-icon.moon { opacity: 1; transform: rotate(0deg); }
  .knob-icon.sun { opacity: 0; transform: rotate(-90deg); }

  html.light .knob-icon.moon { opacity: 0; transform: rotate(90deg); }
  html.light .knob-icon.sun { opacity: 1; transform: rotate(0deg); }

  /* ============ СЕТКА ============ */
  .grid {
    max-width: 1240px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  /* ============ БАР УРОВНЯ ============ */
  .level-bar {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 14px;
    animation: barIn 0.5s cubic-bezier(0.2, 0.8, 0.3, 1) both;
  }

  @keyframes barIn {
    from { opacity: 0; transform: translateX(-20px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .level-badge-bar {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    font-weight: 800;
    font-size: 0.95rem;
    letter-spacing: 0.02em;
    box-shadow: 0 6px 20px var(--accent-glow);
    white-space: nowrap;
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
  }

  .level-badge-bar::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
    transform: translateX(-100%);
    animation: shine 3.5s ease-in-out infinite;
  }

  @keyframes shine {
    0%, 60% { transform: translateX(-100%); }
    100% { transform: translateX(200%); }
  }

  .level-badge-bar .lv-num {
    font-size: 1.15rem;
    font-weight: 900;
    letter-spacing: -0.02em;
  }

  .level-line {
    flex: 1;
    height: 2px;
    background: var(--divider);
    border-radius: 2px;
    position: relative;
    overflow: hidden;
  }

  .level-line::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    transform: scaleX(0);
    transform-origin: left;
    animation: lineGrow 0.9s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
    animation-delay: 0.2s;
  }

  @keyframes lineGrow {
    to { transform: scaleX(1); }
  }

  .level-count {
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--text-muted);
    background: var(--card);
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: 8px;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    box-shadow: 0 1px 3px var(--shadow-soft);
  }

  /* ============ ГРУППА КАРТОЧЕК ============ */
  .level-group {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 18px;
  }

  /* ============ КАРТОЧКА ============ */
  .card {
    position: relative;
    background: linear-gradient(160deg, var(--card), var(--card-grad));
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    box-shadow: 0 4px 16px var(--shadow), inset 0 1px 0 var(--inset-light);
    transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.3, 1),
                border-color 0.25s ease,
                box-shadow 0.25s ease,
                background 0.4s ease;
    overflow: hidden;
    animation: cardIn 0.5s cubic-bezier(0.2, 0.8, 0.3, 1) both;
    will-change: transform;
  }

  html.light .card {
    box-shadow: 0 2px 10px var(--shadow), 0 1px 3px var(--shadow-soft);
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(24px) scale(0.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: var(--radius);
    background: radial-gradient(400px 140px at 50% 0%, var(--accent-glow), transparent 70%);
    opacity: 0;
    transition: opacity 0.35s ease;
    pointer-events: none;
  }

  .card:hover::before { opacity: 1; }

  @media (hover: hover) {
    .card:hover {
      transform: translateY(-5px) scale(1.015);
      border-color: var(--border-hover);
      box-shadow: 0 16px 36px var(--shadow), 0 4px 12px var(--shadow-soft), inset 0 1px 0 var(--inset-light);
    }
  }

  .card:active {
    transform: scale(0.995);
    transition: transform 0.08s ease;
  }

  /* ============ ШАПКА КАРТОЧКИ ============ */
  .card-head {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    min-width: 0;
  }

  .card-icon {
    position: relative;
    font-size: 1.6rem;
    line-height: 1;
    min-width: 48px;
    height: 48px;
    padding: 0 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2px;
    background: linear-gradient(160deg, var(--icon-bg-1), var(--icon-bg-2));
    border-radius: 12px;
    flex-shrink: 0;
    border: 1px solid var(--border);
    white-space: nowrap;
    box-shadow: inset 0 1px 0 var(--inset-light);
    transition: border-color 0.25s ease, transform 0.3s ease, box-shadow 0.25s ease;
  }

  .card:hover .card-icon {
    border-color: var(--border-hover);
    transform: scale(1.06) rotate(-2deg);
    box-shadow: inset 0 1px 0 var(--inset-light), 0 6px 16px var(--accent-glow);
  }

  .lv-badge {
    position: absolute;
    top: -8px;
    left: -8px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    font-size: 0.63rem;
    font-weight: 800;
    line-height: 1;
    padding: 4px 7px;
    border-radius: 6px;
    border: 1.5px solid var(--card);
    letter-spacing: 0.03em;
    white-space: nowrap;
    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.25);
  }

  .card-info {
    min-width: 0;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .card-title {
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--text);
    line-height: 1.25;
    overflow-wrap: anywhere;
    transition: color 0.35s ease;
  }

  .card-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 2px;
  }

  .meta-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 0.75rem;
    line-height: 1;
    color: var(--text-dim);
    background: var(--pill-bg);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 4px 8px;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    transition: background 0.3s ease, border-color 0.3s ease, color 0.3s ease, transform 0.2s ease;
  }

  .meta-pill:hover {
    transform: translateY(-1.5px);
    border-color: var(--border-hover);
  }

  .meta-pill b { color: var(--text); font-weight: 700; }

  .meta-pill.time {
    color: var(--accent);
    border-color: var(--accent);
    background: var(--accent-glow);
  }

  .meta-pill.time b { color: var(--accent); }

  .section-label {
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    font-weight: 800;
    margin-bottom: -6px;
    transition: color 0.35s ease;
  }

  /* ============ КРАФТ-СЕТКА ============ */
  .craft {
    display: grid;
    gap: 5px;
    grid-auto-rows: var(--row-h);
    justify-content: start;
    overflow-x: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
    padding-bottom: 2px;
    -webkit-overflow-scrolling: touch;
  }

  .craft::-webkit-scrollbar { height: 6px; }
  .craft::-webkit-scrollbar-track { background: transparent; }
  .craft::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 3px;
  }

  .slot {
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, var(--slot), var(--slot-grad));
    border: 1px solid var(--border);
    border-radius: 10px;
    line-height: 1;
    overflow: hidden;
    height: var(--row-h);
    padding: 0 4px;
    font-size: 1.35rem;
    white-space: nowrap;
    letter-spacing: -1px;
    box-shadow: inset 0 1px 0 var(--inset-light);
    transition: border-color 0.2s ease, transform 0.2s ease, background 0.4s ease;
    animation: slotPop 0.35s cubic-bezier(0.2, 0.8, 0.3, 1) both;
  }

  @keyframes slotPop {
    from { opacity: 0; transform: scale(0.8); }
    to { opacity: 1; transform: scale(1); }
  }

  @media (hover: hover) {
    .slot:not(.empty):hover {
      border-color: var(--border-hover);
      transform: translateY(-2px) scale(1.04);
      z-index: 2;
      box-shadow: inset 0 1px 0 var(--inset-light), 0 5px 14px var(--accent-glow);
    }
  }

  .slot.empty {
    background:
      repeating-linear-gradient(45deg,
        var(--pill-bg),
        var(--pill-bg) 4px,
        transparent 4px, transparent 8px),
      var(--slot-empty);
    border: 1px dashed var(--border);
    box-shadow: none;
    position: relative;
  }

  .slot.empty::after {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-muted);
    opacity: 0.5;
  }

  /* ============ ПУСТО ============ */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
    font-size: 1.05rem;
  }

  /* ============ АДАПТАЦИЯ ============ */
  @media (max-width: 560px) {
    :root { --row-h: 42px; }

    body { padding: 18px 12px calc(28px + env(safe-area-inset-bottom)); }

    .header {
      margin-bottom: 26px;
      min-height: 48px;
    }

    .theme-toggle {
      width: 50px;
      height: 28px;
    }

    .toggle-knob {
      width: 22px;
      height: 22px;
      font-size: 0.72rem;
    }

    html.light .toggle-knob { left: calc(100% - 24px); }

    .level-badge-bar { padding: 7px 13px; font-size: 0.88rem; }
    .level-badge-bar .lv-num { font-size: 1.05rem; }

    .level-group {
      grid-template-columns: 1fr;
      gap: 14px;
    }

    .card { padding: 14px; gap: 12px; }

    .card-icon {
      min-width: 44px;
      height: 44px;
      font-size: 1.45rem;
      border-radius: 11px;
    }

    .card-title { font-size: 1rem; }

    .meta-pill { font-size: 0.72rem; padding: 3px 7px; }

    .slot { font-size: 1.25rem; }
  }

  @media (max-width: 360px) {
    .card-meta { gap: 5px; }
    .meta-pill { font-size: 0.68rem; padding: 3px 6px; }
    .level-count { display: none; }
  }

  @media (hover: none) {
    .card:hover {
      transform: none;
      border-color: var(--border);
      box-shadow: 0 4px 16px var(--shadow), inset 0 1px 0 var(--inset-light);
    }
    html.light .card:hover {
      box-shadow: 0 2px 10px var(--shadow), 0 1px 3px var(--shadow-soft);
    }
    .card:hover::before { opacity: 0; }
    .card:hover .card-icon { transform: none; }
    .slot:not(.empty):hover {
      transform: none;
      border-color: var(--border);
      box-shadow: inset 0 1px 0 var(--inset-light);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

  <div class="header">
    <h1>Рецепты</h1>
    <button class="theme-toggle" id="themeToggle" aria-label="Переключить тему" type="button">
      <span class="toggle-knob">
        <span class="knob-icon moon">🌙</span>
        <span class="knob-icon sun">☀️</span>
      </span>
    </button>
  </div>

  <div class="grid" id="grid"></div>

<script>

   1) ДАННЫЕ
   ========================================================= */

  { "id": 206, "name": "Фермерский набор", "icon": "🍽️🥗", "craft": [[203, 0], [101, 203]], "exp": 13, "childExp": 89, "time": 855 },

  // ===== УРОВЕНЬ 3 =====
  { "id": 301, "name": "Кукурузная похлёбка", "icon": "🍲🌽", "craft": [[0, 1, 0], [0, 4, 5], [5, 3, 0]], "exp": 55, "childExp": 55, "time": 900 },

/* =========================================================
   2) ИНДЕКСЫ
   ========================================================= */

const plantsById = {};
farmPlants.forEach(p => { plantsById[p.id] = p; });

const craftsById = {};
farmCrafts.forEach(c => { craftsById[c.id] = c; });

/* =========================================================
   3) ХЕЛПЕРЫ
   ========================================================= */

const escapeHtml = (s) =>
  String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

function getLevel(id) { return Math.floor(id / 100); }

function getEmoji(id) {
  if (id === 0) return '';
  if (plantsById[id]) return plantsById[id].icon;
  if (craftsById[id]) return craftsById[id].icon;
  return '❓';
}

function getName(id) {
  if (id === 0) return '';
  if (plantsById[id]) return plantsById[id].name;
  if (craftsById[id]) return craftsById[id].name;
  return `#${id}`;
}

function iconCount(str) { return [...String(str)].length; }

function formatTime(sec) {
  if (sec < 60) return sec + 'с';
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  if (s === 0) return m + 'м';
  return `${m}м ${s}с`;
}

/* =========================================================
   4) РЕНДЕР КАРТОЧКИ
   ========================================================= */

function renderCard(recipe) {
  const cols = Math.max(...recipe.craft.map(r => r.length));
  const level = getLevel(recipe.id);

  const colWidths = new Array(cols).fill(1);
  for (let c = 0; c < cols; c++) {
    for (const row of recipe.craft) {
      const id = row[c] ?? 0;
      if (!id) continue;
      const w = iconCount(getEmoji(id));
      if (w > colWidths[c]) colWidths[c] = w;
    }
  }

  const iconPx = 26;
  const innerPx = 6;
  const colPx = colWidths.map(w => w * iconPx + innerPx);

  const slots = [];
  for (const row of recipe.craft) {
    for (let c = 0; c < cols; c++) {
      const id = row[c] ?? 0;
      if (id === 0) {
        slots.push(`<div class="slot empty"></div>`);
      } else {
        const emoji = getEmoji(id);
        const name = getName(id);
        slots.push(
          `<div class="slot" title="${escapeHtml(name)}">${escapeHtml(emoji)}</div>`
        );
      }
    }
  }

  const gridStyle = `grid-template-columns: ${colPx.map(p => p + 'px').join(' ')};`;

  return `
    <div class="card">
      <div class="card-head">
        <div class="card-icon">
          <span class="lv-badge">Lv.${level}</span>
          ${escapeHtml(recipe.icon)}
        </div>
        <div class="card-info">
          <div class="card-title">${escapeHtml(recipe.name)}</div>
          <div class="card-meta">
            <span class="meta-pill">💡 <b>${recipe.exp}</b></span>
            <span class="meta-pill">👶 <b>${recipe.childExp}</b></span>
            <span class="meta-pill time">⏱ <b>${formatTime(recipe.time)}</b></span>
          </div>
        </div>
      </div>
      <div class="section-label">Крафт</div>
      <div class="craft" style="${gridStyle}">${slots.join('')}</div>
    </div>
  `;
}

/* =========================================================
   5) ГРУППИРОВКА ПО УРОВНЯМ И ОТРИСОВКА
   ========================================================= */

function render() {
  const grid = document.getElementById('grid');

  if (!farmCrafts.length) {
    grid.innerHTML = `<div class="empty-state">Нет рецептов</div>`;
    return;
  }

  const groups = {};
  farmCrafts.forEach(r => {
    const lv = getLevel(r.id);
    if (!groups[lv]) groups[lv] = [];
    groups[lv].push(r);
  });

  const levels = Object.keys(groups).map(Number).sort((a, b) => a - b);

  let html = '';
  let cardIndex = 0;

  levels.forEach((lv, li) => {
    const recipes = groups[lv];

    html += `
      <section class="level-block">
        <div class="level-bar" style="animation-delay: ${li * 0.08}s">
          <span class="level-badge-bar">
            <span class="lv-num">Lv.${lv}</span>
          </span>
          <span class="level-line"></span>
          <span class="level-count">${recipes.length} ${pluralRecipes(recipes.length)}</span>
        </div>
        <div class="level-group">
    `;

    recipes.forEach(recipe => {
      const cardHtml = renderCard(recipe);
      const delay = (cardIndex * 0.04).toFixed(2);
      html += cardHtml.replace(
        'class="card"',
        `class="card" style="animation-delay:${delay}s"`
      );
      cardIndex++;
    });

    html += `
        </div>
      </section>
    `;
  });

  grid.innerHTML = html;
}

function pluralRecipes(n) {
  const mod10 = n % 10;
  const mod100 = n % 100;
  if (mod100 >= 11 && mod100 <= 14) return 'рецептов';
  if (mod10 === 1) return 'рецепт';
  if (mod10 >= 2 && mod10 <= 4) return 'рецепта';
  return 'рецептов';
}

/* =========================================================
   6) ТЕМА
   ========================================================= */

const themeToggle = document.getElementById('themeToggle');
const root = document.documentElement;
const mql = window.matchMedia('(prefers-color-scheme: light)');

function getStoredTheme() {
  try { return localStorage.getItem('theme'); } catch(e) { return null; }
}

function storeTheme(theme) {
  try { localStorage.setItem('theme', theme); } catch(e) {}
}

function applyTheme(theme) {
  if (theme === 'light') {
    root.classList.add('light');
    root.style.colorScheme = 'light';
    document.querySelector('meta[name="theme-color"]')
      ?.setAttribute('content', '#eef2f8');
  } else {
    root.classList.remove('light');
    root.style.colorScheme = 'dark';
    document.querySelector('meta[name="theme-color"]')
      ?.setAttribute('content', '#0d1117');
  }
}

function initTheme() {
  const stored = getStoredTheme();
  if (stored === 'light' || stored === 'dark') {
    applyTheme(stored);
  } else {
    applyTheme(mql.matches ? 'light' : 'dark');
  }
}

function toggleTheme() {
  const isLight = root.classList.contains('light');
  const next = isLight ? 'dark' : 'light';
  applyTheme(next);
  storeTheme(next);
}

themeToggle.addEventListener('click', toggleTheme);
themeToggle.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    toggleTheme();
  }
});

mql.addEventListener('change', (e) => {
  if (!getStoredTheme()) {
    applyTheme(e.matches ? 'light' : 'dark');
  }
});

/* =========================================================
   7) ЗАПУСК
   ========================================================= */

initTheme();
render();
</script>
