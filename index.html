<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f1410">
  <meta name="color-scheme" content="dark">
  <meta name="supported-color-schemes" content="dark">
  <title>Рецепты</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    :root {
      --bg: #0d1117;
      --bg-grad-1: #121821;
      --bg-grad-2: #0a0e14;
      --card: #161d27;
      --card-hover: #1c2530;
      --border: #263140;
      --border-hover: #35455a;
      --slot: #1c2530;
      --slot-empty: #12181f;
      --text: #e8eef6;
      --text-dim: #93a3b8;
      --text-muted: #5f7086;
      --accent: #8ab4f8;
      --accent-dim: #5b82c4;
      --accent-glow: rgba(138, 180, 248, 0.12);
      --shadow: rgba(0, 0, 0, 0.5);
      --icon: 26px;
      --gap: 5px;
      --row-h: 44px;
      --radius: 16px;
    }

    html {
      -webkit-text-size-adjust: 100%;
      forced-color-adjust: none;
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(138, 180, 248, 0.06), transparent 60%),
        linear-gradient(180deg, var(--bg-grad-1), var(--bg-grad-2));
      background-attachment: fixed;
      color: var(--text);
      padding: 32px 16px calc(32px + env(safe-area-inset-bottom));
      padding-top: calc(32px + env(safe-area-inset-top));
      min-height: 100vh;
      min-height: 100dvh;
      line-height: 1.4;
    }

    h1 {
      text-align: center;
      margin-bottom: 32px;
      font-size: clamp(1.4rem, 4vw, 1.9rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(180deg, #ffffff, #b8ccea);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 2px 20px rgba(138, 180, 248, 0.15);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 18px;
      max-width: 1240px;
      margin: 0 auto;
    }

    .card {
      position: relative;
      background: linear-gradient(160deg, var(--card), #131a23);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 4px 16px var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.03);
      transition: transform 0.18s cubic-bezier(0.2, 0.8, 0.3, 1),
                  border-color 0.18s ease,
                  box-shadow 0.18s ease;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: var(--radius);
      background: radial-gradient(400px 120px at 50% 0%, var(--accent-glow), transparent 70%);
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
    }

    .card:hover::before { opacity: 1; }

    @media (hover: hover) {
      .card:hover {
        transform: translateY(-3px);
        border-color: var(--border-hover);
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      }
    }

    .card:active {
      transform: scale(0.995);
      transition: transform 0.08s ease;
    }

    .card-head {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      min-width: 0;
    }

    .card-icon {
      position: relative;
      font-size: 1.6rem;
      line-height: 1;
      min-width: 48px;
      height: 48px;
      padding: 0 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      background: linear-gradient(160deg, var(--slot), #18202a);
      border-radius: 12px;
      flex-shrink: 0;
      border: 1px solid var(--border);
      white-space: nowrap;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    .lv-badge {
      position: absolute;
      top: -8px;
      left: -8px;
      background: linear-gradient(160deg, #2b3a4d, #1f2b3a);
      color: var(--accent);
      font-size: 0.65rem;
      font-weight: 700;
      line-height: 1;
      padding: 3px 6px;
      border-radius: 6px;
      border: 1px solid #3a4d63;
      letter-spacing: 0.02em;
      white-space: nowrap;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
    }

    .card-info {
      min-width: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 2px;
    }

    .meta-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.75rem;
      line-height: 1;
      color: var(--text-dim);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 4px 7px;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .meta-pill b {
      color: var(--text);
      font-weight: 600;
    }

    .meta-pill.time {
      color: var(--accent);
      border-color: rgba(138, 180, 248, 0.22);
      background: rgba(138, 180, 248, 0.06);
    }

    .meta-pill.time b { color: var(--accent); }

    .section-label {
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: -6px;
    }

    .craft {
      display: grid;
      gap: var(--gap);
      grid-auto-rows: var(--row-h);
      justify-content: start;
      overflow-x: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
      padding-bottom: 2px;
      -webkit-overflow-scrolling: touch;
    }

    .craft::-webkit-scrollbar { height: 6px; }
    .craft::-webkit-scrollbar-track { background: transparent; }
    .craft::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    .slot {
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, var(--slot), #18202a);
      border: 1px solid var(--border);
      border-radius: 10px;
      line-height: 1;
      overflow: hidden;
      height: var(--row-h);
      padding: 0 4px;
      font-size: 1.35rem;
      white-space: nowrap;
      letter-spacing: -1px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
      transition: border-color 0.15s ease, transform 0.15s ease;
    }

    @media (hover: hover) {
      .slot:not(.empty):hover {
        border-color: var(--border-hover);
        transform: translateY(-1px);
      }
    }

    .slot.empty {
      background:
        repeating-linear-gradient(
          45deg,
          rgba(255, 255, 255, 0.015),
          rgba(255, 255, 255, 0.015) 4px,
          transparent 4px,
          transparent 8px
        ),
        var(--slot-empty);
      border: 1px dashed #2a3441;
      box-shadow: none;
      position: relative;
    }

    .slot.empty::after {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #2f3b4a;
      opacity: 0.7;
    }

    /* ===== Мобильная адаптация ===== */
    @media (max-width: 560px) {
      :root {
        --row-h: 42px;
        --icon: 24px;
      }

      body {
        padding: 20px 12px calc(20px + env(safe-area-inset-bottom));
        padding-top: calc(20px + env(safe-area-inset-top));
      }

      h1 { margin-bottom: 22px; }

      .grid {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .card {
        padding: 14px;
        gap: 12px;
      }

      .card-icon {
        min-width: 44px;
        height: 44px;
        font-size: 1.45rem;
        border-radius: 11px;
      }

      .card-title { font-size: 1rem; }

      .meta-pill {
        font-size: 0.72rem;
        padding: 3px 6px;
      }

      .slot {
        font-size: 1.25rem;
      }
    }

    @media (max-width: 360px) {
      .card-meta { gap: 5px; }
      .meta-pill { font-size: 0.68rem; }
    }

    @media (hover: none) {
      .card:hover {
        transform: none;
        border-color: var(--border);
        box-shadow: 0 4px 16px var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.03);
      }
      .card:hover::before { opacity: 0; }
      .slot:not(.empty):hover {
        transform: none;
        border-color: var(--border);
      }
    }
  </style>
</head>
<body>
  <h1>Рецепты</h1>
  <div class="grid" id="grid"></div>

  <script>
 const farmCrafts = [
  // ===== УРОВЕНЬ 1 (id 100) — ×1.00 =====
  { "id": 101, "name": "Салат", "icon": "🥗", "craft": [[1, 2]], "exp": 10, "childExp": 10, "time": 180 },
  { "id": 102, "name": "Микс", "icon": "🥤", "craft": [[1, 0], [0, 2]], "exp": 11, "childExp": 11, "time": 210 },
  { "id": 103, "name": "Нарезка", "icon": "🥙", "craft": [[1, 1], [2, 0]], "exp": 13, "childExp": 13, "time": 240 },
  { "id": 104, "name": "Перекус", "icon": "🍽️", "craft": [[2, 2], [1, 0]], "exp": 16, "childExp": 16, "time": 270 },
  { "id": 105, "name": "Комбо", "icon": "🥗🥤", "craft": [[101, 102]], "exp": 6, "childExp": 27, "time": 300 },
  { "id": 106, "name": "Большой салат", "icon": "🥗✨", "craft": [[101, 103], [102, 0]], "exp": 8, "childExp": 44, "time": 390 },

  { "id": 201, "name": "Рагу", "icon": "🍲", "craft": [[3, 1], [4, 2]], "exp": 30, "childExp": 30, "time": 630 },
  { "id": 202, "name": "Томатный суп", "icon": "🍅🍜", "craft": [[4, 4], [1, 2]], "exp": 34, "childExp": 34, "time": 720 },
  { "id": 203, "name": "Икра", "icon": "🍆🥣", "craft": [[3, 3], [4, 1]], "exp": 31, "childExp": 31, "time": 540 },
  { "id": 204, "name": "Обед", "icon": "🍲🥗", "craft": [[101, 102], [201, 0]], "exp": 10, "childExp": 64, "time": 810 },
  { "id": 205, "name": "Сытный суп", "icon": "🍲🥤", "craft": [[105, 106], [202, 0]], "exp": 12, "childExp": 62, "time": 900 },
  { "id": 206, "name": "Фермерский набор", "icon": "🍽️🥗", "craft": [[203, 0], [101, 203]], "exp": 13, "childExp": 89, "time": 855 },

  // ===== УРОВЕНЬ 3 (id 300) — ×1.10 =====
  { "id": 301, "name": "Кукурузная похлёбка", "icon": "🍲🌽", "craft": [[0, 1, 0], [0, 4, 5], [5, 3, 0]], "exp": 55, "childExp": 55, "time": 900 },
  { "id": 302, "name": "Овощная пицца", "icon": "🍕", "craft": [[0, 5, 4], [0, 3, 0], [4, 2, 0]], "exp": 52, "childExp": 52, "time": 1080 },
  { "id": 303, "name": "Рататуй", "icon": "🥘", "craft": [[3, 4, 0], [0, 5, 3]], "exp": 50, "childExp": 50, "time": 1170 },
  { "id": 304, "name": "Кукурузные котлеты", "icon": "🍔", "craft": [[5, 0, 1], [3, 0, 0], [0, 5, 4]], "exp": 58, "childExp": 58, "time": 990 },
  { "id": 305, "name": "Похлёбка-микс", "icon": "🍲🥤", "craft": [[101, 201], [301, 0]], "exp": 15, "childExp": 115, "time": 1260 },
  { "id": 306, "name": "Пицца-сет", "icon": "🍕🥗", "craft": [[102, 202], [0, 302]], "exp": 16, "childExp": 125, "time": 1350 },

  // ===== УРОВЕНЬ 4 (id 400) — ×1.15 =====
  { "id": 401, "name": "Клубничный десерт", "icon": "🍰", "craft": [[6, 6, 6],[0, 5, 0]], "exp": 75, "childExp": 75, "time": 1260 },
  { "id": 402, "name": "Ягодный пирог", "icon": "🥧", "craft": [[6, 7, 0], [0, 6, 6], [0, 6, 0]], "exp": 85, "childExp": 85, "time": 1620 },
  { "id": 403, "name": "Фруктово-овощной салат", "icon": "🥗🍓", "craft": [[0, 7, 6], [6, 4, 0]], "exp": 80, "childExp": 80, "time": 1440 },
  { "id": 404, "name": "Завтрак гурмана", "icon": "🍽️👑", "craft": [[101, 0, 301], [401, 201, 0]], "exp": 22, "childExp": 220, "time": 1710 },
  { "id": 405, "name": "Сладкий сет", "icon": "🍰🥧", "craft": [[0, 202, 302], [102, 0, 402]], "exp": 24, "childExp": 234, "time": 1800 },
  { "id": 406, "name": "Десерт-обед", "icon": "🥧🥘", "craft": [[203, 303], [403, 0]], "exp": 25, "childExp": 215, "time": 1710 },

  // ===== УРОВЕНЬ 5 (id 500) — ×1.20 =====
  { "id": 501, "name": "Авокадо-тост Люкс", "icon": "🥑🍞", "craft": [[7, 4, 0, 0], [0, 3, 0, 0], [0, 5, 7, 0], [0, 0, 0, 7]], "exp": 140, "childExp": 140, "time": 2160 },
  { "id": 502, "name": "Гурман-плато", "icon": "🍽️🥑", "craft": [[7, 6, 7, 0], [0, 5, 0, 3], [0, 4, 0, 0], [0, 0, 7, 1]], "exp": 150, "childExp": 150, "time": 2520 },
  { "id": 503, "name": "Огненное рагу", "icon": "🔥🍲", "craft": [[8, 0, 0, 3], [0, 7, 0, 0], [0, 4, 8, 5], [0, 8, 0, 8]], "exp": 190, "childExp": 190, "time": 2700 },
  { "id": 504, "name": "Королевский ужин", "icon": "👑🍽️", "craft": [[101, 0, 301], [401, 201, 0]], "exp": 35, "childExp": 235, "time": 3240 },
  { "id": 505, "name": "Тост-сет", "icon": "🥑🍽️", "craft": [[0, 202, 302], [402, 0, 102]], "exp": 38, "childExp": 260, "time": 1440 },
  { "id": 506, "name": "Пламя-сет", "icon": "🔥🍽️", "craft": [[203, 0, 403], [503, 0, 303]], "exp": 42, "childExp": 460, "time": 2160 }
]

    const resourceList = [
      ["🥕"], ["🥒"], ["🍆"], ["🍅"],
      ["🌽"], ["🍓"], ["🥑"], ["🌶"]
    ];

    const resources = {};
    resourceList.forEach((r, i) => { resources[i + 1] = r[0]; });

    const craftsById = {};
    farmCrafts.forEach(c => { craftsById[c.id] = c; });

    const escapeHtml = (s) =>
      String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function getLevel(id) {
      return Math.floor(id / 100);
    }

    function getEmoji(id) {
      if (id === 0) return '';
      if (resources[id]) return resources[id];
      if (craftsById[id]) return craftsById[id].icon;
      return '❓';
    }

    function getName(id) {
      if (id === 0) return '';
      if (resources[id]) return `Ресурс #${id}`;
      if (craftsById[id]) return craftsById[id].name;
      return `#${id}`;
    }

    function iconCount(str) {
      return [...String(str)].length;
    }

    function formatTime(sec) {
      if (sec < 60) return sec + 'с';
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      if (s === 0) return m + 'м';
      return `${m}м ${s}с`;
    }

    function renderCard(recipe) {
      const cols = Math.max(...recipe.craft.map(r => r.length));
      const level = getLevel(recipe.id);

      const colWidths = new Array(cols).fill(1);
      for (let c = 0; c < cols; c++) {
        for (const row of recipe.craft) {
          const id = row[c] ?? 0;
          if (!id) continue;
          const w = iconCount(getEmoji(id));
          if (w > colWidths[c]) colWidths[c] = w;
        }
      }

      const iconPx = 26;
      const innerPx = 6;
      const colPx = colWidths.map(w => w * iconPx + innerPx);

      const slots = [];
      for (const row of recipe.craft) {
        for (let c = 0; c < cols; c++) {
          const id = row[c] ?? 0;
          if (id === 0) {
            slots.push(`<div class="slot empty"></div>`);
          } else {
            const emoji = getEmoji(id);
            const name = getName(id);
            slots.push(
              `<div class="slot" title="${escapeHtml(name)}">${escapeHtml(emoji)}</div>`
            );
          }
        }
      }

      const gridStyle =
        `grid-template-columns: ${colPx.map(p => p + 'px').join(' ')};`;

      return `
        <div class="card">
          <div class="card-head">
            <div class="card-icon">
              <span class="lv-badge">Lv.${level}</span>
              ${escapeHtml(recipe.icon)}
            </div>
            <div class="card-info">
              <div class="card-title">${escapeHtml(recipe.name)}</div>
              <div class="card-meta">
                <span class="meta-pill">💡 <b>${recipe.exp}</b></span>
                <span class="meta-pill">👶 <b>${recipe.childExp}</b></span>
                <span class="meta-pill time">⏱ <b>${formatTime(recipe.time)}</b></span>
              </div>
            </div>
          </div>
          <div class="section-label">Крафт</div>
          <div class="craft" style="${gridStyle}">${slots.join('')}</div>
        </div>
      `;
    }

    document.getElementById('grid').innerHTML =
      farmCrafts.map(renderCard).join('');
  </script>
</body>
</html>
