<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d1117">
<meta name="color-scheme" content="dark light">
<title>Карта мира</title>
<style>
  :root {
    --bg-1: #0f1419; --bg-2: #0a0d12;
    --card: #161d27; --card-2: #131a23;
    --border: #263140;
    --text: #e8eef6; --text-dim: #93a3b8; --text-mut: #5f7086;
    --accent: #ffa94d; --accent-2: #ff8c42;
    --accent-glow: rgba(255,169,77,0.16);
    --accent-glow-strong: rgba(255,140,66,0.4);
    --grad: linear-gradient(135deg, #ffa94d 0%, #ff8c42 50%, #ff6b35 100%);
    --grad-soft: linear-gradient(135deg, rgba(255,169,77,0.15), rgba(255,140,66,0.05));
    --shadow: rgba(0,0,0,0.5);
    --radius: 18px;
    --divider: #2a3644;
    --toggle-bg: #1f2a36; --toggle-border: #2f3d4f;
    --glow-1: rgba(255,169,77,0.12);
    --glow-2: rgba(255,140,66,0.06);
    --inset: rgba(255,255,255,0.05);
    --pill-bg: rgba(255,255,255,0.04);
    --line: #34424f;
    --line-hi: rgba(255,169,77,0.85);
    --tag-bg: rgba(255,255,255,0.06);
    --tag-border: rgba(255,255,255,0.1);
    --rare: #ffc95c;
  }
  html.light {
    --bg-1: #e8dfd1; --bg-2: #d9cdb9;
    --card: #ffffff; --card-2: #fdfaf4;
    --border: #c1a880;
    --text: #120c04; --text-dim: #3f3122; --text-mut: #6e5b41;
    --accent: #c98850; --accent-2: #a35d28;
    --accent-glow: rgba(201, 136, 80, 0.28);
    --accent-glow-strong: rgba(201, 136, 80, 0.5);
    --grad: linear-gradient(135deg, #d99a5c 0%, #c98850 55%, #b07340 100%);
    --grad-soft: linear-gradient(135deg, rgba(201,136,80,0.18), rgba(176,115,64,0.06));
    --shadow: rgba(70, 45, 15, 0.22);
    --shadow-soft: rgba(70, 45, 15, 0.12);
    --divider: #c9b189;
    --toggle-bg: #d6c3a5; --toggle-border: #a58a60;
    --glow-1: rgba(201, 136, 80, 0.16);
    --glow-2: rgba(176, 115, 64, 0.09);
    --inset: rgba(255, 255, 255, 1);
    --pill-bg: rgba(201, 136, 80, 0.10);
    --line: #b8a181;
    --line-hi: rgba(201, 136, 80, 0.9);
    --tag-bg: rgba(0,0,0,0.04);
    --tag-border: rgba(0,0,0,0.08);
    --rare: #b8860b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -10%, var(--glow-1), transparent 60%),
      radial-gradient(800px 500px at 90% 110%, var(--glow-2), transparent 70%),
      linear-gradient(180deg, var(--bg-1), var(--bg-2));
    background-attachment: fixed; color: var(--text);
    padding: 20px 12px calc(20px + env(safe-area-inset-bottom));
    padding-top: calc(20px + env(safe-area-inset-top));
    min-height: 100vh; min-height: 100dvh;
    line-height: 1.5;
    transition: background 0.5s ease, color 0.35s ease;
    overflow-x: hidden;
  }
  .mandarins-bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .mandarin-float {
    position: absolute; font-size: 1.5rem; opacity: 0;
    animation: mandarinFloat linear infinite;
    filter: drop-shadow(0 0 8px var(--accent-glow));
  }
  @keyframes mandarinFloat {
    0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
    10% { opacity: 0.16; }
    90% { opacity: 0.16; }
    100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
  }
  .progress-bar { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 1000; }
  .progress-fill { height: 100%; width: 0%; background: var(--grad); box-shadow: 0 0 14px var(--accent-glow-strong); transition: width 0.1s linear; }

  .header { position: relative; max-width: 1500px; margin: 0 auto 14px; display: flex; align-items: center; justify-content: center; min-height: 52px; }
  h1.title {
    font-size: clamp(1.3rem, 4vw, 1.9rem);
    font-weight: 900; letter-spacing: -0.04em;
    background: var(--grad);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-align: center;
    animation: titleIn 0.7s cubic-bezier(0.2, 0.8, 0.3, 1) both;
  }
  @keyframes titleIn { from { opacity: 0; transform: translateY(-18px); } to { opacity: 1; transform: translateY(0); } }
  .back-link {
    position: absolute; left: 0; top: 50%; transform: translateY(-50%);
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 12px; border-radius: 10px;
    background: var(--card); border: 1px solid var(--border);
    color: var(--text-dim); text-decoration: none;
    font-size: 0.8rem; font-weight: 700;
    transition: all 0.25s ease;
  }
  .back-link:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-50%) translateX(-3px); }
  .theme-toggle {
    position: absolute; right: 0; top: 50%; transform: translateY(-50%);
    width: 56px; height: 30px; border-radius: 30px;
    background: var(--toggle-bg); border: 1px solid var(--toggle-border);
    cursor: pointer; transition: all 0.35s ease;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.08);
  }
  .theme-toggle:hover { border-color: var(--accent); box-shadow: inset 0 2px 4px rgba(0,0,0,0.08), 0 0 28px var(--accent-glow-strong); }
  .toggle-knob {
    position: absolute; top: 2px; left: 2px;
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--grad);
    box-shadow: 0 2px 8px var(--accent-glow-strong);
    transition: left 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.8rem;
  }
  html.light .toggle-knob { left: calc(100% - 26px); }
  .toggle-knob .k-ico { position: absolute; transition: opacity 0.3s, transform 0.4s; }
  .k-ico.moon { opacity: 1; } .k-ico.sun { opacity: 0; transform: rotate(-90deg); }
  html.light .k-ico.moon { opacity: 0; transform: rotate(90deg); }
  html.light .k-ico.sun { opacity: 1; transform: rotate(0deg); }

  .container { max-width: 1500px; margin: 0 auto; }

  .layout {
    display: grid;
    grid-template-columns: 1fr 400px;
    gap: 16px;
    align-items: start;
  }
  @media (max-width: 1100px) {
    .layout { grid-template-columns: 1fr 360px; }
  }
  @media (max-width: 980px) {
    .layout { grid-template-columns: 1fr; }
  }

  .map-wrap {
    position: relative;
    background:
      radial-gradient(900px 500px at 20% 15%, rgba(163,230,53,0.06), transparent 60%),
      radial-gradient(700px 500px at 85% 80%, rgba(139,92,246,0.06), transparent 60%),
      linear-gradient(160deg, var(--card), var(--card-2));
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 6px 20px var(--shadow), inset 0 1px 0 var(--inset);
    overflow: hidden;
    animation: cardIn 0.6s cubic-bezier(0.2, 0.8, 0.3, 1) both;
    touch-action: none;
    cursor: grab;
    user-select: none;
  }
  .map-wrap.grabbing { cursor: grabbing; }
  @keyframes cardIn { from { opacity: 0; transform: translateY(24px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }

  .map-viewport {
    position: relative;
    width: 100%;
    height: 82vh;
    min-height: 540px;
    overflow: hidden;
  }

  .map-stage {
    position: absolute;
    top: 0;
    left: 0;
    transform-origin: 0 0;
    will-change: transform;
  }

  .map-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }

  .map-edge {
    stroke: var(--line);
    stroke-width: 3;
    fill: none;
    stroke-linecap: round;
    transition: stroke 0.25s ease, stroke-width 0.25s ease, opacity 0.25s ease;
  }
  .map-edge.dim { opacity: 0.12; }
  .map-edge.active {
    stroke: var(--line-hi);
    stroke-width: 6;
    filter: drop-shadow(0 0 10px var(--accent-glow-strong));
  }

  .node {
    position: absolute;
    transform: translate(-50%, -50%);
    width: 150px;
    padding: 12px 8px 10px;
    background: linear-gradient(160deg, var(--card), var(--card-2));
    border: 3px solid var(--node-color, var(--border));
    border-radius: 16px;
    text-align: center;
    cursor: pointer;
    transition: box-shadow 0.25s ease, border-color 0.25s ease;
    box-shadow: 0 6px 18px var(--shadow), inset 0 1px 0 var(--inset);
    z-index: 2;
    user-select: none;
  }
  .node:hover {
    border-color: var(--node-color);
    box-shadow: 0 10px 30px var(--shadow), 0 0 34px var(--node-glow);
    z-index: 5;
  }
  .node.selected {
    border-color: var(--node-color);
    box-shadow: 0 0 0 5px var(--node-glow), 0 14px 36px var(--shadow);
    z-index: 6;
  }
  .node-icon { font-size: 1.9rem; line-height: 1; display: block; margin-bottom: 5px; }
  .node-name {
    font-size: 0.92rem; font-weight: 800;
    color: var(--text); line-height: 1.2;
    overflow-wrap: anywhere;
  }

  .node-marks {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 3px;
    margin-top: 5px;
    min-height: 16px;
  }
  .node-mark {
    font-size: 0.9rem;
    line-height: 1;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.4));
  }

  .zoom-controls {
    position: absolute;
    top: 14px;
    right: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 10;
  }
  .zoom-btn {
    width: 42px; height: 42px;
    border-radius: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 1.25rem;
    font-weight: 800;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 10px var(--shadow);
    transition: all 0.2s ease;
    font-family: inherit;
    padding: 0;
  }
  .zoom-btn:hover { border-color: var(--accent); color: var(--accent); }
  .zoom-btn:active { transform: scale(0.94); }
  .zoom-btn svg { width: 20px; height: 20px; display: block; }
  .zoom-btn.reset-btn svg { width: 22px; height: 22px; }

  .info-panel {
    background: linear-gradient(160deg, var(--card), var(--card-2));
    border: 1px solid var(--border);
    border-left: 5px solid var(--type-color, var(--accent));
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: 0 6px 20px var(--shadow);
    animation: cardIn 0.35s cubic-bezier(0.2, 0.8, 0.3, 1) both;
    position: sticky;
    top: 16px;
    max-height: 88vh;
    overflow-y: auto;
  }
  .info-panel::-webkit-scrollbar { width: 6px; }
  .info-panel::-webkit-scrollbar-track { background: transparent; }
  .info-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .info-panel-head { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .info-icon {
    width: 60px; height: 60px; border-radius: 16px;
    background: var(--grad-soft);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.9rem; flex-shrink: 0;
  }
  .info-name { font-size: 1.15rem; font-weight: 800; color: var(--text); }
  .info-type {
    font-size: 0.68rem; font-weight: 800;
    text-transform: uppercase; letter-spacing: 0.12em;
    padding: 3px 10px;
    border-radius: 8px;
    background: var(--pill-bg);
    border: 1px solid var(--type-color, var(--border));
    color: var(--type-color, var(--accent));
    display: inline-block;
    margin-top: 4px;
  }
  .info-type .type-stars { color: var(--rare); font-size: 0.72rem; margin-left: 5px; text-shadow: 0 0 6px rgba(255, 201, 92, 0.55); font-weight: 900; }
  .info-hint { color: var(--text-mut); font-size: 0.9rem; text-align: center; padding: 24px 10px; }
  .info-block { margin-top: 14px; }
  .info-block-label {
    font-size: 0.66rem; font-weight: 800;
    text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--text-mut); margin-bottom: 8px;
  }
  .info-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .info-tag {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 12px; border-radius: 10px;
    background: var(--grad-soft);
    border: 1px solid var(--border);
    font-size: 0.83rem; font-weight: 700;
    color: var(--text-dim);
  }
  .info-tag .lvl { color: var(--accent); font-size: 0.72rem; font-weight: 800; }

  /* Стили для лута */
  .loot-section {
    margin-top: 10px;
    border-top: 1px solid var(--divider);
    padding-top: 8px;
}
  .loot-title {
    font-size: 0.7rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--accent);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
.loot-item {
    margin-bottom: 6px;
    background: var(--tag-bg);
    border-radius: 10px;
    padding: 8px 10px;
    border: 1px solid var(--tag-border);
}
.loot-item:last-child {
    margin-bottom: 0;
}
.loot-enemy {
    font-weight: 800;
    font-size: 0.9rem;
    color: var(--text);
    margin: 0;
    line-height: 1.3;
}
  .loot-drops {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 6px;
  }
  .loot-drop {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 10px;
    border-radius: 8px;
    background: var(--tag-bg);
    border: 1px solid var(--tag-border);
    font-size: 0.78rem;
    color: var(--text-dim);
  }
  .loot-drop .chance {
    color: var(--accent);
    font-weight: 800;
    font-size: 0.72rem;
  }
  .loot-drop.rare {
    border-color: var(--rare);
    background: rgba(255, 201, 92, 0.08);
  }
  .loot-drop.rare .chance { color: var(--rare); }
  .loot-subtitle {
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--text-mut);
    margin-top: 4px;
    margin-bottom: 2px;
}
  .info-stars-row {
    display: flex;
    gap: 6px;
    margin-top: 6px;
    flex-wrap: wrap;
  }
  .info-star-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 10px;
    border-radius: 8px;
    background: var(--tag-bg);
    border: 1px solid var(--tag-border);
    font-size: 0.78rem;
    color: var(--text-dim);
  }
  .info-star-chip.req { border-color: var(--rare); color: var(--rare); }

  .footer {
    max-width: 1500px; margin: 40px auto 0;
    padding: 30px 16px 20px;
    border-top: 1px solid var(--divider);
    text-align: center; color: var(--text-mut); font-size: 0.85rem;
  }
  .footer-links { display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; margin-bottom: 18px; }
  .footer-links a { color: var(--text-dim); text-decoration: none; font-weight: 600; transition: color 0.2s ease; }
  .footer-links a:hover { color: var(--accent); }
  .footer-dev { margin-top: 12px; padding-top: 16px; border-top: 1px dashed var(--divider); font-size: 0.82rem; }
  .footer-dev a { color: var(--accent); text-decoration: none; font-weight: 700; }

  @media (max-width: 560px) {
    body { padding: 14px 8px calc(16px + env(safe-area-inset-bottom)); }
    .header { min-height: 44px; margin-bottom: 12px; }
    .theme-toggle { width: 50px; height: 28px; }
    .toggle-knob { width: 22px; height: 22px; font-size: 0.72rem; }
    html.light .toggle-knob { left: calc(100% - 24px); }
    .back-link { padding: 6px 10px; font-size: 0.72rem; }
    .map-viewport { height: 68vh; min-height: 460px; }
    .info-panel { padding: 16px; position: static; max-height: none; }
    .node { width: 120px; padding: 9px 6px 8px; }
    .node-icon { font-size: 1.55rem; }
    .node-name { font-size: 0.8rem; }
    .node-mark { font-size: 0.78rem; }
    .zoom-controls { top: 10px; right: 10px; gap: 7px; }
    .zoom-btn { width: 46px; height: 46px; font-size: 1.5rem; border-radius: 13px; }
    .zoom-btn svg { width: 22px; height: 22px; }
    .zoom-btn.reset-btn svg { width: 25px; height: 25px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }
  html.light body {
    background:
      radial-gradient(1000px 500px at 50% -10%, var(--glow-1), transparent 60%),
      radial-gradient(700px 400px at 90% 110%, var(--glow-2), transparent 70%),
      linear-gradient(180deg, var(--bg-1), var(--bg-2));
  }
  html.light .map-wrap, html.light .info-panel, html.light .zoom-btn {
    box-shadow: 0 1px 0 rgba(255, 255, 255, 1) inset, 0 6px 20px var(--shadow-soft), 0 2px 6px rgba(70, 45, 15, 0.08);
  }
  html.light .node {
    background: linear-gradient(160deg, #fbf3e5, #f0e2c9);
    box-shadow: 0 1px 0 #fff inset, 0 4px 12px rgba(70, 45, 15, 0.15);
  }
</style>
</head>
<body>

  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="mandarins-bg" id="mandarinsBg"></div>

  <div class="header">

  <div class="container">

      </div>

          </div>

  </div>

  <div class="footer">
    <div class="footer-links">

    </div>

<script>
/* ============================================================
   ТИПЫ ЛОКАЦИЙ
   ============================================================ */
const TYPES = {
  1:  { label: "Обычная",  color: "#a3e635" },
  2:  { label: "Страж",    color: "#f472b6" },
  3:  { label: "Опасная",  color: "#ef4444" },
  4:  { label: "Бой",      color: "#fb923c" },
  5:  { label: "Босс",     color: "#dc2626" },
  6:  { label: "Роща",     color: "#22c55e" },

function formatItemRef(type, itemId, count) {
  // type: 2 - предмет, 3 - награда
  if (type === 2) {
    const name = campItemNames[itemId] || `item#${itemId}`;
    return `${name}${count > 1 ? ` x${count}` : ''}`;
  } else if (type === 3) {
    // награда: [type, awardId, num]
    const name = awardNames[itemId] || `award#${itemId}`;
    let display = name;
    if (itemId == 33 || itemId === 34 || itemId === 35 || itemId === 36 || itemId === 32 || itemId === 44 || itemId === 45 || itemId === 50 || itemId === 29 || itemId === 40) {
      // разбор "X_Y"
      if (typeof count === 'string' && count.includes('_')) {
        const [a, b] = count.split('_');
        if (itemId === 32) display = `${b}🔮 (${a}⭐)`;
        else if (itemId === 33) display = `${b}${booksIcons[a-1]}[🔮]`;
        else if (itemId === 34) display = `${b}📖 (${a}⭐)`;
        else if (itemId === 35) display = `${b}${booksIcons[a-1]}[📖]`;
        else if (itemId === 36) display = `${b}📚 (${a}⭐)`;
        else if (itemId === 44) display = `${b}🧩[🛡${'⭐'.repeat(a)}]`;
        else if (itemId === 45) display = `${b}🧩[📚${'⭐'.repeat(a)}]`;
        else if (itemId === 50) display = `${soilsNames(a)} x${b}`;
      }
    }
    return display;
  }
  return `?`;
}

const soilsNames = (a) => {
  const names = {1:"🧪Удобрение I", 2:"🧪Удобрение II", 3:"🧪Удобрение III"};
  return names[a] || `Удобрение ${a}`;
};

function splitIcon(name) {
  const m = String(name).match(/^([\p{Extended_Pictographic}\u{1F3FB}-\u{1F3FF}\u{FE0F}\u{200D}]+)\s*(.*)$/u);
  if (m) return { icon: m[1], text: m[2] || name };
  return { icon: "📍", text: name };
}
function iconOnly(name) {
  const m = String(name).match(/^([\p{Extended_Pictographic}\u{1F3FB}-\u{1F3FF}\u{FE0F}\u{200D}]+)/u);
  return m ? m[1] : "";
}

function getBuildLvl(build, placeId) {
  if (!build.lvlPlaces || build.lvlPlaces.length === 0) return 1;
  const idx = build.lvlPlaces.indexOf(placeId);
  if (idx === -1) return 1;
  return idx + 2;
}

function getMeta(p) {
  const type = TYPES[p.type] || TYPES[1];
  const { icon, text } = splitIcon(p.name);
  const builds = (p.builds || []).map(bid => {
    const b = campBuilds.find(x => x.id === bid);
    if (!b) return null;
    const lvl = getBuildLvl(b, p.id);
    return { ...b, lvl };
  }).filter(Boolean);
  const npcs = campNpcs.filter(n => n.stPlace === p.id);
  const mines = (p.mineItems || []).map(mid => campItems.find(x => x.id === mid)).filter(Boolean);
  const enemies = [];
  if (p.fight) p.fight.forEach(f => f.name && enemies.push(f.name));
  if (p.enemies) enemies.push("Случайные враги");
  const keyName = p.key ? (campItems.find(i => i.id === p.key)?.name || `Ключ #${p.key}`) : null;
  const starsDo = STAR_TYPES.has(p.type) ? (p.starsDo || 0) : 0;
  return { type, icon, text, builds, npcs, mines, enemies, keyName, starsDo };
}

function renderHuntSection(p) {
  if (!p.hunt) return '';
  const [list, energy, times, time] = p.hunt;
  // список: массив [type, itemId] или [type, itemId, count]
  // type: 1 - животное (itemId - ID животного), 2 - campItem, 3 - награда
  const items = list.map(entry => {
    const t = entry[0];
    const id = entry[1];
    if (t === 1) {
      const name = animalsMap[id] || `animal#${id}`;
      return `<span class="loot-drop">${name}</span>`;
    } else if (t === 2) {
      const name = campItemNames[id] || `item#${id}`;
      return `<span class="loot-drop">${name}</span>`;
    } else if (t === 3) {
      const name = awardNames[id] || `award#${id}`;
      return `<span class="loot-drop">${name}</span>`;
    }
    return '';
  }).join('');

  return `
    <div class="loot-section">
      <div class="loot-title">🐾 Охота</div>
      <div class="loot-item">
        <div class="loot-subtitle">⚡${energy} · ${time}с (x${times} существ)</div>
        <div class="loot-drops">${items || '<span class="loot-drop">—</span>'}</div>
      </div>
    </div>
  `;

const chipHtml = (t, id, cnt, isRare) => {

  if (id === 21) return `<span class="${cls}">${n}📙 (🔪)</span>`;
  if (id === 22) return `<span class="${cls}">${n}📕 (🔪)</span>`;
  if (id === 23) return `<span class="${cls}">${n}📦[🛠]</span>`;
  if (id === 24) return `<span class="${cls}">${n}📦[💠]</span>`;

  if (id === 52) return `<span class="${cls}">${n}🔷️Ядро маны</span>`;
  if (id === 51) return `<span class="${cls}">${n}🔑</span>`;
  if (id === 54) return `<span class="${cls}">${n}🎲</span>`;

    ? (campItemNames[id] || `item#${id}`)
    : (awardNames[id] || `award#${id}`);
  return `<span class="${cls}">${n}${name}</span>`;
};

function renderEnemiesSection(p) {
  if (!p.enemies) return '';
  let blocksHtml = '';

  const isFight = p.energyFight !== undefined;
  const title = isFight
    ? `👹 Возможные враги (⚡${p.energyFight} за бой)`
    : `👹 Возможные враги (${p.chance || 15}% шанс)`;

  const parseEnemy = (raw) => {
    if (Array.isArray(raw) && raw.length >= 3 && typeof raw[0] === 'object' && raw[0].name) {
      return { enemy: raw[0], dropData: raw[2] };
    }
    if (raw && typeof raw === 'object' && raw.name) {
      return { enemy: raw, dropData: { drop: raw.drop, rare: raw.rare } };
    }
    return null;
  };

  // Форматирует один чип [t, id, cnt]
  // t: 2 - предмет (campItems), 3 - награда (awardNames)
  // cnt: число или "X_Y"
  const chipHtml = (t, id, cnt, isRare) => {
    const cls = `loot-drop${isRare ? ' rare' : ''}`;
    let name = '';
    if (t === 2) name = campItemNames[id] || `item#${id}`;
    else if (t === 3) name = awardNames[id] || `award#${id}`;
    else return '';

    // Строковый формат "X_Y"
    if (typeof cnt === 'string' && cnt.includes('_')) {
      const [a, b] = cnt.split('_').map(Number);
      if (id === 32) return `<span class="${cls}">🔮 x${b} (${a}⭐)</span>`;
      if (id === 44) return `<span class="${cls}">🧩 x${b} [🛡${starsStr[a-1]}⭐]</span>`;
      if (id === 45) return `<span class="${cls}">🧩 x${b} [📚${starsStr[a-1]}⭐]</span>`;
      return `<span class="${cls}">${name} x${b} (${a})</span>`;
    }

    // Числовой формат
    const n = Number(cnt) || 1;
    return `<span class="${cls}">${name} x${n}</span>`;
  };

  // Собираем уникальные предметы из всех вариантов drop
  // и объединяем количество: min..max
  const collectDrops = (dropArr, isRare) => {
    if (!Array.isArray(dropArr) || dropArr.length === 0) return '';
    const map = new Map(); // key -> { t, id, min, max, raw }
    dropArr.forEach(variant => {
      if (!Array.isArray(variant)) return;
      variant.forEach(e => {
        if (!Array.isArray(e) || e.length < 2) return;
        const [t, id, cnt] = e;
        const key = `${t}_${id}`;
        const cur = map.get(key);
        if (!cur) {
          map.set(key, { t, id, min: cnt, max: cnt, raw: cnt });
        } else {
          if (typeof cnt === 'number') {
            if (typeof cur.min === 'number') cur.min = Math.min(cur.min, cnt); else cur.min = cnt;
            if (typeof cur.max === 'number') cur.max = Math.max(cur.max, cnt); else cur.max = cnt;
          }
        }
      });
    });

    const chips = [];
    for (const { t, id, min, max, raw } of map.values()) {
      if (typeof min === 'number' && typeof max === 'number' && min !== max) {
        // диапазон
        let name = t === 2 ? (campItemNames[id] || `item#${id}`) : (awardNames[id] || `award#${id}`);
        chips.push(`<span class="loot-drop${isRare ? ' rare' : ''}">${name} x${min}–${max}</span>`);
      } else {
        chips.push(chipHtml(t, id, raw, isRare));
      }
    }
    return chips.join('');
  };

  blocksHtml = p.enemies.map(raw => {
    const parsed = parseEnemy(raw);
    if (!parsed) return '';
    const { enemy, dropData } = parsed;

    const dropsHtml = dropData ? collectDrops(dropData.drop, false) : '';
    const rareHtml = dropData ? collectDrops(dropData.rare, true) : '';

    return `
      <div class="loot-item">
        <div class="loot-enemy">${enemy.name} <span style="color:var(--rare)">${enemy.stars || 1}⭐</span></div>
        ${dropsHtml ? `<div class="loot-subtitle">🎁 Лут:</div><div class="loot-drops">${dropsHtml}</div>` : ''}
        ${rareHtml ? `<div class="loot-subtitle">💎 Редкий лут:</div><div class="loot-drops">${rareHtml}</div>` : ''}
      </div>
    `;
  }).join('');

  if (!blocksHtml) {
    blocksHtml = '<div class="loot-item"><div class="loot-subtitle">Нет данных о луте</div></div>';
  }

  return `
    <div class="loot-section">
      <div class="loot-title">${title}</div>
      ${blocksHtml}
    </div>
  `;
}

function renderEdges() {
  svg.setAttribute('viewBox', `0 0 ${STAGE_W} ${STAGE_H}`);
  svg.innerHTML = '';
  edges.forEach(e => {
    const a = NORM_POS[e.a], b = NORM_POS[e.b];
    if (!a || !b) return;
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', a[0]);
    line.setAttribute('y1', a[1]);
    line.setAttribute('x2', b[0]);
    line.setAttribute('y2', b[1]);
    line.setAttribute('class', 'map-edge');
    line.dataset.a = e.a;
    line.dataset.b = e.b;
    svg.appendChild(line);
  });
}

function renderNodes() {
  campPlaces.forEach(p => {
    const pos = NORM_POS[p.id];
    if (!pos) return;

    const el = document.createElement('div');

function selectNode(id) {
  stage.querySelectorAll('.node').forEach(n => {

const wrap = document.getElementById('mapWrap');
const viewport = document.getElementById('mapViewport');



let scale = 1;
let tx = 0, ty = 0;
let isPanning = false;
let panMoved = false;
let panStart = null;
let activePointer = null;
let pinchStart = null;
let didInitialCenter = false;

const MIN_SCALE = 0.3;
const MAX_SCALE = 2.0;

function applyTransform() {
  stage.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
}

function clampTransform() {
  const vw = viewport.clientWidth;
  const vh = viewport.clientHeight;
  const sw = STAGE_W * scale;
  const sh = STAGE_H * scale;
  if (sw <= vw) tx = (vw - sw) / 2;
  else tx = Math.min(0, Math.max(vw - sw, tx));
  if (sh <= vh) ty = (vh - sh) / 2;
  else ty = Math.min(0, Math.max(vh - sh, ty));
}

function zoomAt(px, py, factor) {
  const newScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, scale * factor));
  if (newScale === scale) return;
  const wx = (px - tx) / scale;
  const wy = (py - ty) / scale;
  scale = newScale;
  tx = px - wx * scale;
  ty = py - wy * scale;
  clampTransform();
  applyTransform();
}

function centerOnNode(id, targetScale = 1) {
  const pos = NORM_POS[id];
  if (!pos) return;
  scale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, targetScale));
  const vw = viewport.clientWidth;
  const vh = viewport.clientHeight;
  tx = vw / 2 - pos[0] * scale;
  ty = vh / 2 - pos[1] * scale;
  clampTransform();
  applyTransform();
}

document.getElementById('zoomIn').addEventListener('click', () => {
  zoomAt(viewport.clientWidth/2, viewport.clientHeight/2, 1.25);
});
document.getElementById('zoomOut').addEventListener('click', () => {
  zoomAt(viewport.clientWidth/2, viewport.clientHeight/2, 1/1.25);
});
document.getElementById('zoomReset').addEventListener('click', () => {
  centerOnNode(1, 1);
});

viewport.addEventListener('pointerdown', (e) => {
   if (window._editDragging) return; 
  if (e.target.closest('.zoom-btn')) return;
  const nodeEl = e.target.closest('.node');
  pointerDownOn = nodeEl ? Number(nodeEl.dataset.id) : null;
  isPanning = true;
  panMoved = false;
  panStart = { x: e.clientX, y: e.clientY, tx, ty };
  activePointer = e.pointerId;
  try { viewport.setPointerCapture(e.pointerId); } catch(_) {}
  wrap.classList.add('grabbing');
});

let pointerDownOn = null;

viewport.addEventListener('pointermove', (e) => {
  if (!isPanning || e.pointerId !== activePointer) return;
  const dx = e.clientX - panStart.x;
  const dy = e.clientY - panStart.y;
  if (!panMoved && (Math.abs(dx) > 5 || Math.abs(dy) > 5)) panMoved = true;
  if (panMoved) {
    tx = panStart.tx + dx;
    ty = panStart.ty + dy;
    clampTransform();
    applyTransform();
  }
});

function endPointer(e) {
  if (!isPanning || e.pointerId !== activePointer) return;
  wrap.classList.remove('grabbing');
  try { viewport.releasePointerCapture(e.pointerId); } catch(_) {}
  isPanning = false;
  activePointer = null;
  if (!panMoved && pointerDownOn != null) {
    selectNode(pointerDownOn);
  }
  pointerDownOn = null;
  panStart = null;
}
viewport.addEventListener('pointerup', endPointer);
viewport.addEventListener('pointercancel', endPointer);

viewport.addEventListener('touchstart', (e) => {
  if (e.touches.length === 2) {
    const [a, b] = e.touches;
    pinchStart = {
      dist: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY),
      cx: (a.clientX + b.clientX) / 2,
      cy: (a.clientY + b.clientY) / 2,
      scale, tx, ty
    };
    isPanning = false;
    activePointer = null;
  }
}, { passive: true });

viewport.addEventListener('touchmove', (e) => {
  if (e.touches.length === 2 && pinchStart) {
    e.preventDefault();
    const [a, b] = e.touches;
    const dist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    const factor = dist / pinchStart.dist;
    const newScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, pinchStart.scale * factor));

    const rect = viewport.getBoundingClientRect();
    const px = pinchStart.cx - rect.left;
    const py = pinchStart.cy - rect.top;

    const wx = (px - pinchStart.tx) / pinchStart.scale;
    const wy = (py - pinchStart.ty) / pinchStart.scale;

    scale = newScale;
    tx = px - wx * scale;
    ty = py - wy * scale;
    clampTransform();
    applyTransform();
  }
}, { passive: false });

viewport.addEventListener('touchend', (e) => {
  if (e.touches.length < 2) pinchStart = null;
});

viewport.addEventListener('wheel', (e) => {
  e.preventDefault();
  const rect = viewport.getBoundingClientRect();
  const px = e.clientX - rect.left;
  const py = e.clientY - rect.top;
  const factor = e.deltaY < 0 ? 1.12 : 1/1.12;
  zoomAt(px, py, factor);
}, { passive: false });

window.addEventListener('resize', () => {
  clampTransform();
  applyTransform();
});

/* ============ ПРОГРЕСС-БАР ============ */
const progressFill = document.getElementById('progressFill');
window.addEventListener('scroll', () => {
  const h = document.documentElement.scrollHeight - window.innerHeight;
  progressFill.style.width = (h > 0 ? (window.scrollY / h) * 100 : 0) + '%';
}, { passive: true });

/* ============ ТЕМА ============ */
const themeToggle = document.getElementById('themeToggle');
const root = document.documentElement;
const mql = window.matchMedia('(prefers-color-scheme: light)');
function getStoredTheme() { try { return localStorage.getItem('theme'); } catch(e) { return null; } }
function storeTheme(t) { try { localStorage.setItem('theme', t); } catch(e) {} }
function applyTheme(t) {
  if (t === 'light') {
    root.classList.add('light'); root.style.colorScheme = 'light';
    document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#fff8f0');
  } else {
    root.classList.remove('light'); root.style.colorScheme = 'dark';
    document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#0d1117');
  }
}
function initTheme() {
  const s = getStoredTheme();
  if (s === 'light' || s === 'dark') applyTheme(s);
  else applyTheme(mql.matches ? 'light' : 'dark');
}
function toggleTheme() {
  const isLight = root.classList.contains('light');
  applyTheme(isLight ? 'dark' : 'light');
  storeTheme(isLight ? 'dark' : 'light');
}
themeToggle.addEventListener('click', toggleTheme);
themeToggle.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleTheme(); }
});
mql.addEventListener('change', (e) => { if (!getStoredTheme()) applyTheme(e.matches ? 'light' : 'dark'); });

/* ============ ФОН ============ */
(function() {
  const bg = document.getElementById('mandarinsBg');
  const count = window.innerWidth < 600 ? 10 : 16;
  const emojis = ['🍊','⛏️','⚔️','💎','🌿','🔥','⭐'];
  for (let i = 0; i < count; i++) {
    const m = document.createElement('span');
    m.className = 'mandarin-float';
    m.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    m.style.left = Math.random() * 100 + '%';
    m.style.fontSize = (1 + Math.random() * 1.4) + 'rem';
    m.style.animationDuration = (18 + Math.random() * 14) + 's';
    m.style.animationDelay = (Math.random() * 22) + 's';
    bg.appendChild(m);
  }
})();

/* ============ СТАРТ ============ */
initTheme();
renderEdges();
renderNodes();

/* ============================================================
   РЕЖИМ РЕДАКТИРОВАНИЯ ПОЗИЦИЙ + АВТООБНОВЛЕНИЕ СВЯЗЕЙ
   Активация: долгое нажатие (500 мс) на узел
   ============================================================ */
const EDIT_MODE = false;

if (EDIT_MODE) {
  const editPositions = {};
  campPlaces.forEach(p => {
    const pos = NORM_POS[p.id];
    if (pos) editPositions[p.id] = [pos[0], pos[1]];
  });

  let editNodeId = null;
  let isDragging = false;
  let dragOffset = { x: 0, y: 0 };
  let longPressTimer = null;
  let pointerStartPos = null;

  const LONG_PRESS_MS = 500;

  function nodeElById(id) {
    return stage.querySelector(`.node[data-id="${id}"]`);
  }

  /* ---------- АВТООБНОВЛЕНИЕ СВЯЗЕЙ ---------- */
  function updateEdgesForNode(nodeId, x, y) {
    svg.querySelectorAll('.map-edge').forEach(line => {
      const a = Number(line.dataset.a);
      const b = Number(line.dataset.b);
      if (a === nodeId) {
        line.setAttribute('x1', x);
        line.setAttribute('y1', y);
      }
      if (b === nodeId) {
        line.setAttribute('x2', x);
        line.setAttribute('y2', y);
      }
    });
  }

  /* ---------- ВХОД/ВЫХОД ИЗ РЕЖИМА ---------- */
  function enterEditMode(id) {
    if (editNodeId !== null && editNodeId !== id) exitEditMode();
    editNodeId = id;
    const el = nodeElById(id);
    if (!el) return;

    el.style.cursor = 'move';
    el.style.zIndex = 100;
    el.style.boxShadow = '0 0 0 5px #ffa94d, 0 14px 36px rgba(0,0,0,.7)';
    el.style.borderColor = '#ffa94d';

    console.log(`✏️ EDIT: узел #${id} (${nodesById[id]?.name || ''}) — тащи`);
  }

  function exitEditMode() {
    if (editNodeId === null) return;
    const el = nodeElById(editNodeId);
    if (el) {
      el.style.cursor = '';
      el.style.zIndex = '';
      el.style.boxShadow = '';
      el.style.borderColor = '';
    }
    editNodeId = null;
    isDragging = false;
    window._editDragging = false;
    dumpPositions();
  }

  /* ---------- НАЖАТИЕ ---------- */
  stage.addEventListener('pointerdown', (e) => {
    const nodeEl = e.target.closest('.node');
    if (!nodeEl) return;

    const id = Number(nodeEl.dataset.id);

    if (editNodeId === id) {
      e.stopPropagation();
      e.preventDefault();
      startDrag(e, nodeEl, id);
      return;
    }

    pointerStartPos = { x: e.clientX, y: e.clientY };
    longPressTimer = setTimeout(() => {
      longPressTimer = null;
      enterEditMode(id);
      startDrag(e, nodeEl, id);
    }, LONG_PRESS_MS);
  }, true);

  function startDrag(e, nodeEl, id) {
    isDragging = true;
    window._editDragging = true;

    const stageRect = stage.getBoundingClientRect();
    const sx = (e.clientX - stageRect.left) / scale;
    const sy = (e.clientY - stageRect.top) / scale;

    const cur = editPositions[id];
    dragOffset.x = sx - cur[0];
    dragOffset.y = sy - cur[1];

    try { nodeEl.setPointerCapture(e.pointerId); } catch (_) {}
    nodeEl.style.boxShadow = '0 0 0 7px #ffa94d, 0 14px 36px rgba(0,0,0,.8)';
  }

  /* ---------- ДВИЖЕНИЕ ---------- */
  stage.addEventListener('pointermove', (e) => {
    if (longPressTimer && pointerStartPos) {
      const dx = e.clientX - pointerStartPos.x;
      const dy = e.clientY - pointerStartPos.y;
      if (Math.hypot(dx, dy) > 8) {
        clearTimeout(longPressTimer);
        longPressTimer = null;
      }
    }

    if (!isDragging || editNodeId === null) return;

    const nodeEl = nodeElById(editNodeId);
    if (!nodeEl) return;

    const stageRect = stage.getBoundingClientRect();
    const sx = (e.clientX - stageRect.left) / scale;
    const sy = (e.clientY - stageRect.top) / scale;

    const nx = Math.round(sx - dragOffset.x);
    const ny = Math.round(sy - dragOffset.y);

    editPositions[editNodeId] = [nx, ny];
    nodeEl.style.left = nx + 'px';
    nodeEl.style.top = ny + 'px';

    // ← АВТООБНОВЛЕНИЕ СВЯЗЕЙ В РЕАЛЬНОМ ВРЕМЕНИ
    updateEdgesForNode(editNodeId, nx, ny);
  }, true);

  /* ---------- ОТПУСКАНИЕ ---------- */
  stage.addEventListener('pointerup', (e) => {
    if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
    if (!isDragging) return;

    isDragging = false;
    window._editDragging = false;

    // фиксируем позицию в NORM_POS (чтобы centerOnNode работал корректно)
    if (editNodeId !== null && editPositions[editNodeId]) {
      NORM_POS[editNodeId] = [...editPositions[editNodeId]];
    }

    const nodeEl = editNodeId !== null ? nodeElById(editNodeId) : null;
    if (nodeEl) {
      nodeEl.style.boxShadow = '0 0 0 5px #ffa94d, 0 14px 36px rgba(0,0,0,.7)';
      try { nodeEl.releasePointerCapture(e.pointerId); } catch (_) {}
    }
    dumpPositions();
  }, true);

  stage.addEventListener('pointercancel', (e) => {
    if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
    if (!isDragging) return;
    isDragging = false;
    window._editDragging = false;
  }, true);

  /* ---------- ВЫХОД ПО КЛИКУ ВНЕ УЗЛА ---------- */
  viewport.addEventListener('pointerdown', (e) => {
    if (editNodeId === null) return;
    if (e.target.closest('.node')) return;
    exitEditMode();
  }, true);

  /* ---------- ДАМП POS ---------- */
  function dumpPositions() {
    const out = {};
    Object.keys(editPositions).sort((a, b) => Number(a) - Number(b)).forEach(k => {
      const [x, y] = editPositions[k];
      out[k] = [Math.round(x + minX - PAD), Math.round(y + minY - PAD)];
    });
    console.clear();
    console.log('%c=== POS ===', 'color:#ffa94d;font-weight:bold;font-size:14px');
    console.log('const POS = ' + JSON.stringify(out, null, 2) + ';');
    console.log('%c=== /POS ===', 'color:#ffa94d;font-weight:bold;font-size:14px');
    return out;
  }

  setTimeout(dumpPositions, 200);

  /* ---------- КНОПКА POS ---------- */
  const copyBtn = document.createElement('button');
  copyBtn.textContent = '📋 POS';
  copyBtn.style.cssText = `
    position: absolute; top: 14px; left: 14px; z-index: 30;
    padding: 10px 14px; border-radius: 12px;
    background: #161d27; color: #ffa94d;
    border: 1px solid #ffa94d; cursor: pointer;
    font-weight: 800; font-family: inherit; font-size: 0.85rem;
    box-shadow: 0 4px 14px rgba(0,0,0,.5);
  `;
  copyBtn.onclick = (ev) => {
    ev.stopPropagation();
    const out = dumpPositions();
    const text = 'const POS = ' + JSON.stringify(out, null, 2) + ';';
    navigator.clipboard.writeText(text).then(() => {
      copyBtn.textContent = '✅ Скопировано!';
      setTimeout(() => copyBtn.textContent = '📋 POS', 1500);
    }).catch(() => {
      copyBtn.textContent = '❌ Ctrl+C в консоли';
      setTimeout(() => copyBtn.textContent = '📋 POS', 2000);
    });
  };
  document.getElementById('mapWrap').appendChild(copyBtn);

  console.log('%c🛠 РЕЖИМ РЕДАКТИРОВАНИЯ ВКЛЮЧЁН', 'color:#a3e635;font-weight:bold;font-size:16px');
}

requestAnimationFrame(() => {
  if (!didInitialCenter) {
    didInitialCenter = true;
    centerOnNode(1, 1);
  }
});
</script>
